# pnpm 12 reads every non-auth setting from this file.

# The site and the generated German and English variants of the projects, never the bilingual sources
packages:
  - site
  - case/*/de
  - case/*/en
  - exercises/*/*/de
  - exercises/*/*/en
  - exercises/*/*/solution/de
  - exercises/*/*/solution/en
  - optional/*/de
  - optional/*/en

# Never install a version published less than 7 days ago (minutes), transitive packages included.
minimumReleaseAge: 10080
# Fail instead of falling back to a younger version when nothing in range is old enough.
minimumReleaseAgeStrict: true
# Write exact versions into package.json.
savePrefix: ''
