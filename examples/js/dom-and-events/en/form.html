<!doctype html>
<form id="request">
  <label>Name <input name="name" required></label>
  <label>Days <input name="days" type="number" min="1" max="7" value="2"></label>
  <button>Request</button>
</form>
<p id="message"></p>
<script>
  const form = document.querySelector('#request')
  form.addEventListener('submit', (event) => {
    event.preventDefault()
    const data = new FormData(form)
    document.querySelector('#message').textContent = `${data.get('name')}, ${data.get('days')} days`
    console.log(document.querySelector('#message').textContent)
  })
  form.elements.name.value = 'Martina'
  form.requestSubmit()
</script>
