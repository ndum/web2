<!doctype html>
<button id="visit">Count a visit</button>
<p id="count">Visits today: 0</p>
<script>
  let visits = 0
  const button = document.querySelector('#visit')

  function countVisit(event) {
    visits += 1
    document.querySelector('#count').textContent = 'Visits today: ' + visits
    console.log(event.type, event.target.textContent, visits)
  }

  // Pass the function itself, the browser calls it on every click
  button.addEventListener('click', countVisit)

  // Two clicks from the script, so the output shows something
  button.click()
  button.click()
</script>
