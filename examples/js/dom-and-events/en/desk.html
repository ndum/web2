<!doctype html>
<h1>Counter helper</h1>
<p id="count"></p>
<ul id="items"></ul>
<script>
  // from step 3
  const isIn = (item) => item.availableFrom === null

  // from step 4
  const items = [
    { id: 1, name: 'Drill', deposit: 20, availableFrom: null },
    { id: 2, name: 'Tent for four', deposit: 50, availableFrom: '2026-11-12' },
    { id: 3, name: 'Raclette oven', deposit: 30, availableFrom: null },
    { id: 4, name: 'Beer bench set', deposit: 40, availableFrom: '2026-11-03' },
    { id: 5, name: 'Jigsaw', deposit: 20, availableFrom: null },
    { id: 6, name: 'Projector', deposit: 80, availableFrom: null },
    { id: 7, name: 'Ladder', deposit: 20, availableFrom: null },
    { id: 8, name: 'Sleeping bag', deposit: 20, availableFrom: null },
    { id: 9, name: 'Bike trailer', deposit: 60, availableFrom: '2026-11-12' },
  ]

  const list = document.querySelector('#items')
  const count = document.querySelector('#count')
  const reserved = []

  function showCount() {
    let inStock = 0
    for (const item of items) {
      if (isIn(item)) inStock += 1
    }
    count.textContent = `${inStock} of ${items.length} things are in, ${reserved.length} reserved`
  }

  // One entry per thing, only things that are in get a button
  for (const item of items) {
    const entry = document.createElement('li')
    entry.textContent = item.name + ' '
    if (isIn(item)) {
      const button = document.createElement('button')
      button.textContent = 'Reserve'
      button.dataset.id = item.id
      entry.append(button)
    } else {
      entry.append('(on loan)')
    }
    list.append(entry)
  }
  showCount()

  // One listener on the list serves every button, a click rises from the button up to it
  list.addEventListener('click', (event) => {
    const button = event.target.closest('button')
    if (!button) return
    const id = Number(button.dataset.id)
    const item = items.find((thing) => thing.id === id)
    reserved.push(id)
    button.textContent = 'reserved'
    button.disabled = true
    showCount()
    console.log('Reserved:', item.name)
    console.log(count.textContent)
  })

  // A click from the script on the projector, so the output shows something
  list.querySelector('[data-id="6"]').click()
</script>
