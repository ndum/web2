<!doctype html>
<button id="visit">Besuch zählen</button>
<p id="count">Besuche heute: 0</p>
<script>
  let visits = 0
  const button = document.querySelector('#visit')

  function countVisit(event) {
    visits += 1
    document.querySelector('#count').textContent = 'Besuche heute: ' + visits
    console.log(event.type, event.target.textContent, visits)
  }

  // Die Funktion selbst übergeben, der Browser ruft sie bei jedem Klick auf
  button.addEventListener('click', countVisit)

  // Zwei Klicks aus dem Script, damit die Ausgabe etwas zeigt
  button.click()
  button.click()
</script>
