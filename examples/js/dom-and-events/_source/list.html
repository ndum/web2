<!doctype html>
<h1>[%Tresen-Helfer|Counter helper%]</h1>
<ul id="items"></ul>
<script>
  const names = ['[%Bohrmaschine|Drill%]', '[%Zelt für vier Personen|Tent for four%]', '[%Raclette-Ofen|Raclette oven%]']
  const list = document.querySelector('#items')

  for (const name of names) {
    const entry = document.createElement('li')
    entry.textContent = name
    list.append(entry)
  }

  console.log(list.children.length, document.querySelector('li').textContent)
  console.log(document.querySelector('#count') === null)
</script>
