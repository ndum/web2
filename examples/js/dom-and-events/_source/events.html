<!doctype html>
<button id="visit">[%Besuch zählen|Count a visit%]</button>
<p id="count">[%Besuche heute: 0|Visits today: 0%]</p>
<script>
  let visits = 0
  const button = document.querySelector('#visit')

  function countVisit(event) {
    visits += 1
    document.querySelector('#count').textContent = '[%Besuche heute: |Visits today: %]' + visits
    console.log(event.type, event.target.textContent, visits)
  }

  // [%Die Funktion selbst übergeben, der Browser ruft sie bei jedem Klick auf|Pass the function itself, the browser calls it on every click%]
  button.addEventListener('click', countVisit)

  // [%Zwei Klicks aus dem Script, damit die Ausgabe etwas zeigt|Two clicks from the script, so the output shows something%]
  button.click()
  button.click()
</script>
