<!doctype html>
<input id="search" placeholder="[%Suchen|Search%]">
<ul id="items"></ul>
<script>
  const names = [
    '[%Bohrmaschine|Drill%]',
    '[%Zelt für vier Personen|Tent for four%]',
    '[%Raclette-Ofen|Raclette oven%]',
    '[%Festbankgarnitur|Beer bench set%]',
    '[%Stichsäge|Jigsaw%]',
    '[%Beamer|Projector%]',
    '[%Leiter|Ladder%]',
    '[%Schlafsack|Sleeping bag%]',
    '[%Velo-Anhänger|Bike trailer%]',
  ]
  const list = document.querySelector('#items')

  function render(query) {
    const wanted = query.trim().toLowerCase()
    list.replaceChildren()
    for (const name of names) {
      if (!name.toLowerCase().includes(wanted)) continue
      const entry = document.createElement('li')
      entry.textContent = name
      list.append(entry)
    }
    console.log(list.children.length)
  }

  const search = document.querySelector('#search')
  search.addEventListener('input', () => render(search.value))
  render('')
  search.value = '[%säge|saw%]'
  search.dispatchEvent(new Event('input'))
</script>
