<!doctype html>
<h1>[%Tresen-Helfer|Counter helper%]</h1>
<p id="count"></p>
<ul id="items"></ul>
<script>
  // [%aus Schritt 3|from step 3%]
  const isIn = (item) => item.availableFrom === null

  // [%aus Schritt 4|from step 4%]
  const items = [
    { id: 1, name: '[%Bohrmaschine|Drill%]', deposit: 20, availableFrom: null },
    { id: 2, name: '[%Zelt für vier Personen|Tent for four%]', deposit: 50, availableFrom: '2026-11-12' },
    { id: 3, name: '[%Raclette-Ofen|Raclette oven%]', deposit: 30, availableFrom: null },
    { id: 4, name: '[%Festbankgarnitur|Beer bench set%]', deposit: 40, availableFrom: '2026-11-03' },
    { id: 5, name: '[%Stichsäge|Jigsaw%]', deposit: 20, availableFrom: null },
    { id: 6, name: '[%Beamer|Projector%]', deposit: 80, availableFrom: null },
    { id: 7, name: '[%Leiter|Ladder%]', deposit: 20, availableFrom: null },
    { id: 8, name: '[%Schlafsack|Sleeping bag%]', deposit: 20, availableFrom: null },
    { id: 9, name: '[%Velo-Anhänger|Bike trailer%]', deposit: 60, availableFrom: '2026-11-12' },
  ]

  const list = document.querySelector('#items')
  const count = document.querySelector('#count')
  const reserved = []

  function showCount() {
    let inStock = 0
    for (const item of items) {
      if (isIn(item)) inStock += 1
    }
    count.textContent = `${inStock} [%von|of%] ${items.length} [%Dingen sind da|things are in%], ${reserved.length} [%reserviert|reserved%]`
  }

  // [%Ein Eintrag pro Ding, einen Knopf bekommt nur, was da ist|One entry per thing, only things that are in get a button%]
  for (const item of items) {
    const entry = document.createElement('li')
    entry.textContent = item.name + ' '
    if (isIn(item)) {
      const button = document.createElement('button')
      button.textContent = '[%Reservieren|Reserve%]'
      button.dataset.id = item.id
      entry.append(button)
    } else {
      entry.append('([%ausgeliehen|on loan%])')
    }
    list.append(entry)
  }
  showCount()

  // [%Ein Listener auf der Liste bedient alle Knöpfe, ein Klick steigt vom Knopf zu ihm auf|One listener on the list serves every button, a click rises from the button up to it%]
  list.addEventListener('click', (event) => {
    const button = event.target.closest('button')
    if (!button) return
    const id = Number(button.dataset.id)
    const item = items.find((thing) => thing.id === id)
    reserved.push(id)
    button.textContent = '[%reserviert|reserved%]'
    button.disabled = true
    showCount()
    console.log('[%Reserviert:|Reserved:%]', item.name)
    console.log(count.textContent)
  })

  // [%Ein Klick aus dem Script auf den Beamer, damit die Ausgabe etwas zeigt|A click from the script on the projector, so the output shows something%]
  list.querySelector('[data-id="6"]').click()
</script>
