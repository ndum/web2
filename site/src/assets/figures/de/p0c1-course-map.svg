<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 204" role="img" aria-labelledby="p0c1-map-de-title p0c1-map-de-desc">
<title id="p0c1-map-de-title">Der Kurs im Überblick</title>
