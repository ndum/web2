<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" role="img" aria-labelledby="p0c1-map-de-title p0c1-map-de-desc">
<title id="p0c1-map-de-title">Der Kurs im Überblick</title>
<desc id="p0c1-map-de-desc">Ein waagrechter Balken zeigt die 50 Lektionen des Moduls. Die Teile 0 bis 7 füllen die Lektionen 1 bis 28, die Prüfung liegt in den Lektionen 29 und 30, das Projekt mit Teil 8 nimmt die Lektionen 31 bis 50 ein. Unter dem Balken stehen die Namen der Teile.</desc>
