<rect class="fig-box" x="330" y="232" width="330" height="52" rx="10"/>
<text class="fig-text" x="346" y="264">Microtask-Queue</text>
<rect class="fig-box fig-box-strong" x="522" y="242" width="60" height="32" rx="6"/>
<text class="fig-code" x="552" y="263" text-anchor="middle">then</text>
<rect class="fig-box fig-box-strong" x="590" y="242" width="60" height="32" rx="6"/>
<text class="fig-code" x="620" y="263" text-anchor="middle">await</text>
<path class="fig-arrow" d="M 328 258 L 224 258" marker-end="url(#p1c4-loop-de-head)"/>
<rect class="fig-label-bg" x="224.8" y="237" width="102.39999999999999" height="18" rx="3"/>
<text class="fig-sub" x="276" y="250" text-anchor="middle">1. zuerst alle</text>
<text class="fig-sub fig-note" x="20" y="316">Ist der Stapel leer, holt die Ereignisschleife zuerst alle Microtasks, dann einen Task.</text>
