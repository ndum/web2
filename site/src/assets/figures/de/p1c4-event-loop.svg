<rect class="fig-label-bg" x="305.9" y="59" width="56.199999999999996" height="18" rx="3"/>
<text class="fig-sub" x="334" y="72" text-anchor="middle">startet</text>
<path class="fig-arrow" d="M 555 112 L 555 146" marker-end="url(#p1c4-loop-de-head)"/>
<text class="fig-sub" x="566" y="134">fertig</text>
<rect class="fig-box" x="330" y="150" width="330" height="52" rx="10"/>
<text class="fig-text" x="346" y="182">Task-Queue</text>
<rect class="fig-box fig-box-strong" x="522" y="160" width="60" height="32" rx="6"/>
<text class="fig-code" x="552" y="181" text-anchor="middle">Timer</text>
<rect class="fig-box fig-box-strong" x="590" y="160" width="60" height="32" rx="6"/>
<text class="fig-code" x="620" y="181" text-anchor="middle">Klick</text>
<path class="fig-arrow" d="M 328 176 L 224 176" marker-end="url(#p1c4-loop-de-head)"/>
<rect class="fig-label-bg" x="228.1" y="155" width="95.8" height="18" rx="3"/>
