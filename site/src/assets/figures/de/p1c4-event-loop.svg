<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 326" role="img" aria-labelledby="p1c4-loop-de-title p1c4-loop-de-desc">
<title id="p1c4-loop-de-title">Die Ereignisschleife mit Task-Queue und Microtask-Queue</title>
<desc id="p1c4-loop-de-desc">Links steht der Aufrufstapel mit den Funktionen, die gerade laufen. Ein Pfeil führt nach rechts zu Timern und Anfragen, die der Browser oder Node übernimmt, etwa setTimeout und fetch. Ist ein Timer abgelaufen, kommt sein Callback in die Task-Queue, ebenso Klicks. Promises legen ihre Fortsetzungen mit then und await in die Microtask-Queue. Zwei Pfeile führen zurück zum Aufrufstapel. Ist der Stapel leer, holt die Ereignisschleife zuerst alle Microtasks und danach einen Task.</desc>
