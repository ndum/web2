<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" role="img" aria-labelledby="p1c2-references-de-title p1c2-references-de-desc">
<title id="p1c2-references-de-title">Zwei Variablen, ein Objekt</title>
<desc id="p1c2-references-de-desc">Links stehen die Variablen tent, sameTent und copy, rechts zwei Objekte im Speicher. Von tent und von sameTent führt je ein Pfeil zum selben Objekt, in dem availableFrom gleich 2026-11-14 steht. Von copy führt ein Pfeil zu einem zweiten Objekt, das mit dem Spread-Operator entstanden ist und in dem availableFrom noch null ist.</desc>
<defs><marker id="p1c2-references-de-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p1c2-references-de-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p1c2-references-de-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="292" rx="14"/>
<rect class="d-band d-band-1" x="16" y="16" width="220" height="260" rx="12"/>
<text class="d-label" x="32" y="40" text-anchor="start">VARIABLEN</text>
<rect class="d-band d-band-2" x="300" y="16" width="364" height="260" rx="12"/>
<text class="d-label d-label-blue" x="316" y="40" text-anchor="start">OBJEKTE IM SPEICHER</text>
