<text class="d-title" x="126" y="222.5" text-anchor="middle">copy</text>
<rect class="d-shadow" x="316" y="57.5" width="332" height="100" rx="10"/>
<rect class="d-tile d-tile-accent" x="316" y="56" width="332" height="100" rx="10"/>
<g class="d-icon d-icon-accent" transform="translate(328 97) scale(0.75)"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></g>
<text class="d-title" x="356" y="103" text-anchor="start">Zelt für vier Personen</text>
<text class="d-code" x="356" y="119" text-anchor="start">availableFrom: '2026-11-14'</text>
<text class="d-sub" x="316" y="178" text-anchor="start"><tspan class="d-code">tent</tspan> und <tspan class="d-code">sameTent</tspan> zeigen auf dasselbe Objekt</text>
