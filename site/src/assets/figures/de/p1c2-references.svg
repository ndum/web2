<text class="d-code" x="356" y="231" text-anchor="start">availableFrom: null</text>
<text class="d-sub" x="316" y="262" text-anchor="start"><tspan class="d-code">copy</tspan> zeigt auf eine Kopie, entstanden mit <tspan class="d-code">{ ...tent }</tspan></text>
