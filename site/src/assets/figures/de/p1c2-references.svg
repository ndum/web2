<path class="d-arrow d-arrow-accent" d="M 220 134 L 312 134" marker-end="url(#p1c2-references-de-head-accent)"/>
<path class="d-arrow" d="M 220 218 L 312 218" marker-end="url(#p1c2-references-de-head)"/>
<rect class="d-shadow" x="32" y="57.5" width="188" height="44" rx="10"/>
