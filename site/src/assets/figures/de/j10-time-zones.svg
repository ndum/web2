<title id="j10-zones-de-title">Ein Zeitpunkt in drei Zeitzonen</title>
<desc id="j10-zones-de-desc">Links der Wert availableFrom des Zelts, der Text 2026-11-12 ohne Uhrzeit. new Date liest ihn als Mitternacht in UTC. Rechts derselbe Zeitpunkt in drei Zeitzonen. In UTC ist es der 12. November um Mitternacht, in Zürich der 12. November um 1 Uhr und in New York noch der 11. November um 19 Uhr. Mit timeZone UTC formatiert, zeigt ein Datum ohne Uhrzeit überall den 12. November.</desc>
