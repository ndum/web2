<rect class="d-band d-band-1" x="16" y="136" width="452" height="104" rx="12"/>
<text class="d-label" x="32" y="160" text-anchor="start">VITE AUF PORT 5173</text>
<rect class="d-band d-band-3" x="16" y="256" width="648" height="104" rx="12"/>
<text class="d-label d-label-violet" x="32" y="280" text-anchor="start">KURS-API AUF PORT 3000</text>
