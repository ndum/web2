<path class="d-arrow" d="M 352 225.5 L 352 292" marker-end="url(#p7c3-path-de-head)"/>
<path class="d-arrow" d="M 252 320 L 216 320" marker-end="url(#p7c3-path-de-head)"/>
<path class="d-arrow d-dashed" d="M 452 80 L 492 80 L 492 320 L 456 320" marker-end="url(#p7c3-path-de-head)"/>
