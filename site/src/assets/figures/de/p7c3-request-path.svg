<g class="d-icon" transform="translate(264 71) scale(0.75)"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.5"/><path d="M4.5 5.5v13c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-13"/><path d="M4.5 12c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5"/></g>
<text class="d-title" x="292" y="77" text-anchor="start">Store</text>
<text class="d-code" x="292" y="93" text-anchor="start">fetch('/api/de/items')</text>
