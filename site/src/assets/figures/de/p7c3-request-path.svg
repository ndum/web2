<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 422" role="img" aria-labelledby="p7c3-path-de-title p7c3-path-de-desc">
<title id="p7c3-path-de-title">Der Weg einer Anfrage</title>
<desc id="p7c3-path-de-desc">Drei Bereiche von oben nach unten zeigen den Browser mit der Seite von localhost:5173, Vite auf Port 5173 und die Kurs-API auf Port 3000. Im Browser ruft eine Komponente eine Action des Stores auf, und der Store schickt fetch an /api/de/items. Der Proxy von Vite nimmt die Anfrage an und leitet alles unter /api an die Kurs-API weiter. Die API beantwortet GET /de/items mit dem Katalog und hält Rückgaben und Anfragen in storage/state.json fest. Die Antwort nimmt denselben Weg zurück. Rechts führt ein gestrichelter Pfeil vom Store an Vite vorbei direkt an localhost:3000. Dieser Weg geht an eine andere Adresse und braucht darum CORS.</desc>
