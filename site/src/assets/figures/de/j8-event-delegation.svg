<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img" aria-labelledby="j8-delegation-de-title j8-delegation-de-desc">
<title id="j8-delegation-de-title">Event-Delegation in der Liste</title>
<desc id="j8-delegation-de-desc">Links der Weg eines Klicks im DOM. Er trifft den Knopf Reservieren des Beamers mit data-id 6, steigt zu dessen Eintrag li auf, dann zur Liste ul mit der id items und weiter bis zum Dokument. Auf der Liste sitzt der einzige Listener. Rechts oben steht der Aufruf list.addEventListener, der ihn anmeldet, darunter in drei Schritten, was er mit dem Klick macht. event.target ist das angeklickte Element, closest liefert den Knopf oder null, und Number macht aus dataset.id die Zahl 6 des Beamers. So bedient ein Listener alle Knöpfe der Liste.</desc>
<defs><marker id="j8-delegation-de-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="j8-delegation-de-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="j8-delegation-de-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="370" rx="14"/>
<rect class="d-band d-band-1" x="16" y="16" width="292" height="292" rx="12"/>
<text class="d-label" x="32" y="40" text-anchor="start">SEITE</text>
<text class="d-meta" x="83.6132" y="40" text-anchor="start">der Weg eines Klicks</text>
<rect class="d-band d-band-2" x="356" y="16" width="308" height="292" rx="12"/>
<text class="d-label d-label-blue" x="372" y="40" text-anchor="start">LISTENER</text>
<text class="d-meta" x="450.0396" y="40" text-anchor="start">einer für alle Knöpfe</text>
<rect class="d-placeholder" x="32" y="56" width="260" height="32" rx="10"/>
<text class="d-sub" x="162" y="76" text-anchor="middle">weiter bis zum Dokument</text>
<rect class="d-shadow" x="32" y="113.5" width="260" height="44" rx="10"/>
<rect class="d-tile d-tile-accent" x="32" y="112" width="260" height="44" rx="10"/>
<g class="d-icon d-icon-accent" transform="translate(44 125) scale(0.75)"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></g>
<text class="d-title" x="72" y="131" text-anchor="start">Liste der Dinge</text>
<text class="d-code" x="72" y="147" text-anchor="start">&lt;ul id="items"&gt;</text>
<rect class="d-shadow" x="32" y="181.5" width="260" height="44" rx="10"/>
<rect class="d-tile" x="32" y="180" width="260" height="44" rx="10"/>
<g class="d-icon" transform="translate(44 193) scale(0.75)"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></g>
<text class="d-title" x="72" y="199" text-anchor="start">Eintrag Beamer</text>
<text class="d-code" x="72" y="215" text-anchor="start">&lt;li&gt;</text>
<rect class="d-shadow" x="32" y="249.5" width="260" height="44" rx="10"/>
<rect class="d-tile" x="32" y="248" width="260" height="44" rx="10"/>
<g class="d-icon" transform="translate(44 261) scale(0.75)"><path d="M5.5 3.5 18 10l-5.6 1.8L10 17.5z"/><path d="M12.4 11.8 17 18.5"/></g>
<text class="d-title" x="72" y="267" text-anchor="start">Knopf Reservieren</text>
<text class="d-code" x="72" y="283" text-anchor="start">&lt;button data-id="6"&gt;</text>
<rect class="d-tag" x="221" y="125" width="59" height="18" rx="9"/>
<text class="d-tag-text" x="250.5" y="137.5" text-anchor="middle">Listener</text>
<path class="d-arrow d-arrow-accent" d="M 162 248 L 162 229.5" marker-end="url(#j8-delegation-de-head-accent)"/>
<text class="d-sub" x="172" y="240" text-anchor="start">der Klick steigt auf</text>
<path class="d-arrow d-arrow-accent" d="M 162 180 L 162 161.5" marker-end="url(#j8-delegation-de-head-accent)"/>
<path class="d-arrow d-dashed" d="M 162 112 L 162 92" marker-end="url(#j8-delegation-de-head)"/>
<text class="d-code" x="372" y="76" text-anchor="start">list.addEventListener('click', …)</text>
<path class="d-arrow d-arrow-accent" d="M 292 134 L 368 134" marker-end="url(#j8-delegation-de-head-accent)"/>
<text class="d-sub" x="332" y="126" text-anchor="middle">ruft auf</text>
<circle class="d-badge d-badge-accent" cx="382" cy="134" r="10"/>
<text class="d-badge-text d-badge-text-accent" x="382" y="138" text-anchor="middle">1</text>
<rect class="d-shadow" x="400" y="113.5" width="248" height="44" rx="10"/>
<rect class="d-tile" x="400" y="112" width="248" height="44" rx="10"/>
<text class="d-title" x="524" y="131" text-anchor="middle">Ziel des Klicks</text>
<text class="d-code" x="524" y="147" text-anchor="middle">event.target</text>
<circle class="d-badge" cx="382" cy="202" r="10"/>
<text class="d-badge-text" x="382" y="206" text-anchor="middle">2</text>
<rect class="d-shadow" x="400" y="181.5" width="248" height="44" rx="10"/>
<rect class="d-tile" x="400" y="180" width="248" height="44" rx="10"/>
<text class="d-title" x="524" y="199" text-anchor="middle">Knopf oder null</text>
<text class="d-code" x="524" y="215" text-anchor="middle">target.closest('button')</text>
<circle class="d-badge" cx="382" cy="270" r="10"/>
<text class="d-badge-text" x="382" y="274" text-anchor="middle">3</text>
<rect class="d-shadow" x="400" y="249.5" width="248" height="44" rx="10"/>
<rect class="d-tile" x="400" y="248" width="248" height="44" rx="10"/>
<text class="d-title" x="524" y="267" text-anchor="middle">Ding 6, der Beamer</text>
<text class="d-code" x="524" y="283" text-anchor="middle">Number(button.dataset.id)</text>
<rect class="d-strip" x="16" y="324" width="648" height="30" rx="8"/>
<text class="d-sub" x="340" y="343" text-anchor="middle">Ein Listener auf der Liste bedient alle Knöpfe, auch solche, die später dazukommen.</text>
</svg>
