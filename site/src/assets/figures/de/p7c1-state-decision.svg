<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 472" role="img" aria-labelledby="p7c1-decision-de-title p7c1-decision-de-desc">
<title id="p7c1-decision-de-title">Wohin ein Zustand gehört</title>
<desc id="p7c1-decision-de-desc">Ein Entscheidungsbaum mit vier Fragen von oben nach unten. Soll eine Adresse den Wert festhalten, zum Teilen und Neuladen, gehört er in die Adresse, als route.params oder route.query. Liegt er sonst auf dem Server, holt ihn ein Store mit fetch in einer Action. Braucht ihn sonst nur eine Komponente, bleibt er lokal als ref in der Komponente. Brauchen ihn sonst wenige Komponenten mit gemeinsamer Elternkomponente, kommt er in die Elternkomponente und geht mit Props und Events weiter. In allen anderen Fällen gehört er in einen Store mit Pinia.</desc>
<defs><marker id="p7c1-decision-de-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fig-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<rect class="fig-box" x="20" y="16" width="300" height="56" rx="18"/>
<text class="fig-sub fig-strong" x="36" y="39" style="font-size: 14px">Soll eine Adresse den Wert</text>
<text class="fig-sub fig-strong" x="36" y="57" style="font-size: 14px">festhalten, zum Teilen und Neuladen?</text>
<path class="fig-arrow" d="M 322 44 L 396 44" marker-end="url(#p7c1-decision-de-head)"/>
<text class="fig-sub" x="360" y="36" text-anchor="middle">ja</text>
<rect class="fig-box fig-box-strong" x="400" y="16" width="250" height="56" rx="6"/>
<text class="fig-text" x="414" y="39" style="font-size: 14px">In die Adresse</text>
<text class="fig-code" x="414" y="58">route.params, route.query</text>
<path class="fig-arrow" d="M 170 74 L 170 108" marker-end="url(#p7c1-decision-de-head)"/>
<text class="fig-sub" x="180" y="97">nein</text>
<rect class="fig-box" x="20" y="112" width="300" height="56" rx="18"/>
<text class="fig-sub fig-strong" x="36" y="135" style="font-size: 14px">Liegt der Wert auf dem Server,</text>
<text class="fig-sub fig-strong" x="36" y="153" style="font-size: 14px">etwa Katalog und Anfragen?</text>
<path class="fig-arrow" d="M 322 140 L 396 140" marker-end="url(#p7c1-decision-de-head)"/>
<text class="fig-sub" x="360" y="132" text-anchor="middle">ja</text>
<rect class="fig-box fig-box-strong" x="400" y="112" width="250" height="56" rx="6"/>
<text class="fig-text" x="414" y="135" style="font-size: 14px">Ein Store fragt den Server</text>
<text class="fig-code" x="414" y="154">fetch in einer Action</text>
<path class="fig-arrow" d="M 170 170 L 170 204" marker-end="url(#p7c1-decision-de-head)"/>
<text class="fig-sub" x="180" y="193">nein</text>
<rect class="fig-box" x="20" y="208" width="300" height="56" rx="18"/>
<text class="fig-sub fig-strong" x="36" y="231" style="font-size: 14px">Braucht ihn nur eine Komponente,</text>
<text class="fig-sub fig-strong" x="36" y="249" style="font-size: 14px">etwa ein offener Dialog?</text>
<path class="fig-arrow" d="M 322 236 L 396 236" marker-end="url(#p7c1-decision-de-head)"/>
<text class="fig-sub" x="360" y="228" text-anchor="middle">ja</text>
<rect class="fig-box fig-box-strong" x="400" y="208" width="250" height="56" rx="6"/>
<text class="fig-text" x="414" y="231" style="font-size: 14px">Lokal in der Komponente</text>
<text class="fig-code" x="414" y="250">ref</text>
<path class="fig-arrow" d="M 170 266 L 170 300" marker-end="url(#p7c1-decision-de-head)"/>
<text class="fig-sub" x="180" y="289">nein</text>
<rect class="fig-box" x="20" y="304" width="300" height="56" rx="18"/>
<text class="fig-sub fig-strong" x="36" y="327" style="font-size: 14px">Brauchen ihn wenige Komponenten</text>
<text class="fig-sub fig-strong" x="36" y="345" style="font-size: 14px">mit gemeinsamer Elternkomponente?</text>
<path class="fig-arrow" d="M 322 332 L 396 332" marker-end="url(#p7c1-decision-de-head)"/>
<text class="fig-sub" x="360" y="324" text-anchor="middle">ja</text>
<rect class="fig-box fig-box-strong" x="400" y="304" width="250" height="56" rx="6"/>
<text class="fig-text" x="414" y="327" style="font-size: 14px">In die Elternkomponente</text>
<text class="fig-sub" x="414" y="346">Props und Events</text>
<path class="fig-arrow" d="M 170 362 L 170 396" marker-end="url(#p7c1-decision-de-head)"/>
<text class="fig-sub" x="180" y="385">nein</text>
<rect class="fig-box fig-box-strong" x="45" y="400" width="250" height="56" rx="6"/>
<text class="fig-text" x="59" y="423" style="font-size: 14px">In einen Store</text>
<text class="fig-sub" x="59" y="442">Pinia</text>
</svg>
