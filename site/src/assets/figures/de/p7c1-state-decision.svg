<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 472" role="img" aria-labelledby="p7c1-decision-de-title p7c1-decision-de-desc">
<title id="p7c1-decision-de-title">Wohin ein Zustand gehört</title>
<desc id="p7c1-decision-de-desc">Ein Entscheidungsbaum mit vier nummerierten Fragen links von oben nach unten und den Orten für den Zustand rechts. Ein Ja führt zum Ort rechts, ein Nein zur nächsten Frage. Soll eine Adresse den Wert festhalten, zum Teilen und Neuladen, gehört er in die Adresse, als route.params oder route.query. Liegt er sonst auf dem Server, holt ihn ein Store mit fetch in einer Action. Braucht ihn sonst nur eine Komponente, bleibt er lokal als ref in der Komponente. Brauchen ihn sonst wenige Komponenten mit gemeinsamer Elternkomponente, kommt er in die Elternkomponente und geht mit Props und Events weiter. In allen anderen Fällen gehört er in einen Store mit Pinia.</desc>
