<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" role="img" aria-labelledby="p2c2-loop-de-title p2c2-loop-de-desc">
<title id="p2c2-loop-de-title">Der Kreislauf der SPA von Hand</title>
<desc id="p2c2-loop-de-desc">Vier Karten bilden einen Kreislauf. Der Zustand ist ein Objekt mit status, items und route. Die Funktion render liest den Zustand und schreibt daraus die Seite. Auf der Seite lösen Klicks, Eingaben und hashchange Events aus. Die Handler der Events ändern den Zustand, und der Kreislauf beginnt von vorn. Die Handler ändern die Seite nie direkt.</desc>
<defs><marker id="p2c2-loop-de-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p2c2-loop-de-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p2c2-loop-de-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="310" rx="14"/>
<path class="d-arrow" d="M 276 60 L 400 60" marker-end="url(#p2c2-loop-de-head)"/>
<text class="d-sub" x="340" y="52" text-anchor="middle">liest</text>
<path class="d-arrow" d="M 514 89.5 L 514 172" marker-end="url(#p2c2-loop-de-head)"/>
<text class="d-sub" x="524" y="136" text-anchor="start">schreibt</text>
<path class="d-arrow" d="M 404 204 L 280 204" marker-end="url(#p2c2-loop-de-head)"/>
<text class="d-sub" x="340" y="196" text-anchor="middle">löst aus</text>
<path class="d-arrow d-arrow-accent" d="M 166 176 L 166 93.5" marker-end="url(#p2c2-loop-de-head-accent)"/>
<text class="d-sub" x="176" y="136" text-anchor="start">ändert</text>
<rect class="d-shadow" x="56" y="33.5" width="220" height="56" rx="10"/>
<rect class="d-tile d-tile-accent" x="56" y="32" width="220" height="56" rx="10"/>
<g class="d-icon d-icon-accent" transform="translate(68 51) scale(0.75)"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.5"/><path d="M4.5 5.5v13c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-13"/><path d="M4.5 12c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5"/></g>
<text class="d-title" x="96" y="57" text-anchor="start">Zustand</text>
<text class="d-code" x="96" y="73" text-anchor="start">{ status, items, route }</text>
<rect class="d-shadow" x="404" y="33.5" width="220" height="56" rx="10"/>
<rect class="d-tile" x="404" y="32" width="220" height="56" rx="10"/>
<g class="d-icon" transform="translate(416 51) scale(0.75)"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 6l-3 12"/></g>
<text class="d-title" x="444" y="57" text-anchor="start">render()</text>
<text class="d-sub" x="444" y="73" text-anchor="start">baut HTML aus dem Zustand</text>
<rect class="d-shadow" x="404" y="177.5" width="220" height="56" rx="10"/>
<rect class="d-tile" x="404" y="176" width="220" height="56" rx="10"/>
<g class="d-icon" transform="translate(416 195) scale(0.75)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M6.5 6.5h.01M9.5 6.5h.01"/></g>
<text class="d-title" x="444" y="201" text-anchor="start">Seite</text>
<text class="d-sub" x="444" y="217" text-anchor="start">das DOM im Browser</text>
<rect class="d-shadow" x="56" y="177.5" width="220" height="56" rx="10"/>
<rect class="d-tile" x="56" y="176" width="220" height="56" rx="10"/>
<g class="d-icon" transform="translate(68 195) scale(0.75)"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/></g>
<text class="d-title" x="96" y="201" text-anchor="start">Event</text>
<text class="d-sub" x="96" y="217" text-anchor="start">Klick, Eingabe, hashchange</text>
<rect class="d-strip" x="56" y="260" width="568" height="30" rx="8"/>
