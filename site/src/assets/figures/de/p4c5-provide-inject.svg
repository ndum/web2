<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" role="img" aria-labelledby="p4c5-provide-de-title p4c5-provide-de-desc">
<title id="p4c5-provide-de-title">Props durchreichen oder provide und inject</title>
<desc id="p4c5-provide-de-desc">Links reicht App das Mitglied als Prop an ItemView weiter und ItemView an ReservationForm, obwohl ItemView es selbst nicht braucht. Rechts stellt App das Mitglied mit provide bereit, und ReservationForm holt es mit inject, ohne dass ItemView davon weiss.</desc>
<defs><marker id="p4c5-provide-de-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fig-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<text class="fig-text" x="30" y="30">Props durchreichen</text>
<rect class="fig-box fig-box-strong" x="30" y="50" width="190" height="50" rx="8"/>
<text class="fig-text" x="125" y="80" text-anchor="middle">App.vue</text>
<rect class="fig-box" x="30" y="150" width="190" height="50" rx="8"/>
<text class="fig-text" x="125" y="180" text-anchor="middle">ItemView.vue</text>
<rect class="fig-box fig-box-strong" x="30" y="250" width="190" height="50" rx="8"/>
<text class="fig-text" x="125" y="280" text-anchor="middle">ReservationForm.vue</text>
<path class="fig-arrow" d="M 125 102 L 125 146" marker-end="url(#p4c5-provide-de-head)"/>
<rect class="fig-label-bg" x="94.45" y="117" width="61.1" height="18" rx="3"/>
<text class="fig-code" x="125" y="130" text-anchor="middle">:member</text>
<path class="fig-arrow" d="M 125 202 L 125 246" marker-end="url(#p4c5-provide-de-head)"/>
<rect class="fig-label-bg" x="94.45" y="217" width="61.1" height="18" rx="3"/>
<text class="fig-code" x="125" y="230" text-anchor="middle">:member</text>
<text class="fig-sub fig-note" x="230" y="180">braucht member nicht</text>
<text class="fig-text" x="370" y="30">provide und inject</text>
<rect class="fig-box fig-box-strong" x="370" y="50" width="190" height="50" rx="8"/>
<text class="fig-text" x="465" y="80" text-anchor="middle">App.vue</text>
<rect class="fig-box" x="370" y="150" width="190" height="50" rx="8"/>
<text class="fig-text" x="465" y="180" text-anchor="middle">ItemView.vue</text>
<rect class="fig-box fig-box-strong" x="370" y="250" width="190" height="50" rx="8"/>
<text class="fig-text" x="465" y="280" text-anchor="middle">ReservationForm.vue</text>
<text class="fig-code" x="370" y="118">provide(memberKey, member)</text>
<path class="fig-arrow" d="M 570 76 C 660 120, 660 230, 566 272" marker-end="url(#p4c5-provide-de-head)"/>
<text class="fig-code" x="370" y="322">inject(memberKey)</text>
</svg>
