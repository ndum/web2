<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" role="img" aria-labelledby="p4c2-flow-de-title p4c2-flow-de-desc">
<title id="p4c2-flow-de-title">Props fliessen von der Eltern- zur Kindkomponente</title>
<desc id="p4c2-flow-de-desc">Oben steht die Komponente App mit dem Katalog. Drei Pfeile führen nach unten zu drei Karten der Komponente ItemCard. An jedem Pfeil stehen die Props, die App übergibt, zum Beispiel name gleich Bohrmaschine und category gleich Werkzeug. Jede Karte zeigt nur, was sie bekommen hat. Ein Pfeil zurück nach oben fehlt, die Daten fliessen nur von oben nach unten.</desc>
