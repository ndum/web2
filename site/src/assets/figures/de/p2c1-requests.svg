<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 342" role="img" aria-labelledby="p2c1-requests-de-title p2c1-requests-de-desc">
<title id="p2c1-requests-de-title">Anfragen einer mehrseitigen Website und einer SPA</title>
<desc id="p2c1-requests-de-desc">Links eine mehrseitige Website, rechts eine Single Page Application, jeweils in drei Schritten. Beim Öffnen des Katalogs lädt die mehrseitige Website eine ganze Seite, die SPA eine fast leere Seite, ihr JavaScript und die Daten als JSON. Beim Klick auf den Beamer und beim Zurück zum Katalog lädt die mehrseitige Website jedes Mal eine ganze Seite, die SPA schickt keine Anfrage, ihr JavaScript zeigt das Ding und den Katalog selbst an.</desc>
<text class="fig-text" x="20" y="28">Mehrseitige Website (MPA)</text>
<text class="fig-text" x="350" y="28">Single Page Application (SPA)</text>
