<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" role="img" aria-labelledby="p8c1-folders-de-title p8c1-folders-de-desc">
<title id="p8c1-folders-de-title">Ordner nach Art und nach Feature</title>
<desc id="p8c1-folders-de-desc">Zwei Ordnerbäume nebeneinander. Links ist die App nach Art der Dateien geordnet, in views, components, stores und composables, und die vier markierten Dateien der Anfragen liegen in vier verschiedenen Ordnern. Rechts hat jedes Feature einen Ordner unter features, catalog und reservations mit ihren Seiten, Komponenten, Stores und Routen. Die Dateien der Anfragen liegen dort beisammen im Ordner reservations. Gemeinsame Bausteine stehen in components, die Schicht für die API in api.</desc>
