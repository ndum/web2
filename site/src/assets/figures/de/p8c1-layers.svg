<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 408" role="img" aria-labelledby="p8c1-layers-de-title p8c1-layers-de-desc">
<title id="p8c1-layers-de-title">Die Schichten der App</title>
<desc id="p8c1-layers-de-desc">Vier Ebenen von oben nach unten, die Pfeile zeigen, wer wen importiert. Ein Bereich fasst die drei Schichten der App zusammen, der Server liegt darunter ausserhalb. Zuoberst setzen main.js, App.vue und der Router die App zusammen und importieren die Features. Die Features enthalten Seiten, eigene Komponenten und Stores und importieren gemeinsame Bausteine und die Schicht für die API. Gemeinsame Bausteine in components, composables und utils kennen kein Feature. Nur die Schicht für die API in src/api spricht mit fetch mit dem Server. Kein Pfeil zeigt nach oben.</desc>
