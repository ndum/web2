<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 394" role="img" aria-labelledby="j7-check-de-title j7-check-de-desc">
<title id="j7-check-de-title">Eine Anfrage durch checkRequest</title>
<desc id="j7-check-de-desc">Links im Block try die drei Prüfungen von checkRequest untereinander, Mittwoch oder Samstag, höchstens sieben Tage und Ding noch frei, darunter angenommen. Wer eine Prüfung besteht, geht mit ja zur nächsten. Von jeder Prüfung führt ein Pfeil mit throw nach rechts in den Block catch zu der Anfrage, die dort scheitert. Die Bohrmaschine vom 2026-11-09 bis 2026-11-11 scheitert an der ersten Prüfung, der Raclette-Ofen vom 2026-11-07 bis 2026-11-18 an der zweiten und der Beamer vom 2026-11-07 bis 2026-11-11 an der dritten. Der Beamer vom 2026-11-11 bis 2026-11-14 besteht alle drei und wird angenommen, für ihn bleibt catch leer.</desc>
