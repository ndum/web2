<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 578" role="img" aria-labelledby="p5c3-lifecycle-de-title p5c3-lifecycle-de-desc">
<title id="p5c3-lifecycle-de-title">Der Lebenszyklus einer Komponente</title>
<desc id="p5c3-lifecycle-de-desc">Eine Zeitachse von oben nach unten in drei Bändern. Beim Einhängen läuft zuerst setup, dann onBeforeMount, dann onMounted, ab hier steht die Komponente im DOM. Bei jeder Änderung des Zustands folgen onBeforeUpdate und onUpdated, ein Pfeil führt von onUpdated zurück zu onBeforeUpdate. Wenn die Komponente verschwindet, folgen onBeforeUnmount und onUnmounted. Rechts steht neben setup, dass dort der Zustand entsteht und es noch kein DOM gibt, neben onMounted, dass dort Fokus, Messen und Listener hingehören, neben den beiden Hooks für Updates, dass sie bei jeder Änderung laufen, und neben onUnmounted, dass dort Listener und Timer aufgeräumt werden.</desc>
<defs><marker id="p5c3-lifecycle-de-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p5c3-lifecycle-de-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p5c3-lifecycle-de-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="578" rx="14"/>
<rect class="d-band d-band-1" x="16" y="16" width="648" height="210" rx="12"/>
<text class="d-label" x="32" y="40" text-anchor="start">EINHÄNGEN</text>
<rect class="d-band d-band-2" x="16" y="242" width="648" height="152" rx="12"/>
<text class="d-label d-label-blue" x="32" y="266" text-anchor="start">AKTUALISIEREN</text>
<rect class="d-band d-band-1" x="16" y="410" width="648" height="152" rx="12"/>
<text class="d-label" x="32" y="434" text-anchor="start">AUSHÄNGEN</text>
<path class="d-arrow" d="M 140 93.5 L 140 110" marker-end="url(#p5c3-lifecycle-de-head)"/>
<path class="d-arrow" d="M 140 151.5 L 140 168" marker-end="url(#p5c3-lifecycle-de-head)"/>
<path class="d-arrow" d="M 140 209.5 L 140 278" marker-end="url(#p5c3-lifecycle-de-head)"/>
<path class="d-arrow" d="M 140 319.5 L 140 336" marker-end="url(#p5c3-lifecycle-de-head)"/>
<path class="d-arrow" d="M 140 377.5 L 140 446" marker-end="url(#p5c3-lifecycle-de-head)"/>
<path class="d-arrow" d="M 140 487.5 L 140 504" marker-end="url(#p5c3-lifecycle-de-head)"/>
<path class="d-arrow" d="M 240 358 L 268 358 L 268 300 L 244 300" marker-end="url(#p5c3-lifecycle-de-head)"/>
<text class="d-sub" x="304" y="78" text-anchor="start">Zustand anlegen, noch kein DOM</text>
<text class="d-sub" x="304" y="194" text-anchor="start">DOM ist da, Fokus, Messen, Listener</text>
<text class="d-sub" x="304" y="333" text-anchor="start">bei jeder Änderung des Zustands</text>
<text class="d-sub" x="304" y="530" text-anchor="start">aufräumen, Listener und Timer entfernen</text>
<rect class="d-shadow" x="40" y="57.5" width="200" height="36" rx="10"/>
<rect class="d-tile" x="40" y="56" width="200" height="36" rx="10"/>
<text class="d-title" x="140" y="78.5" text-anchor="middle">setup</text>
<rect class="d-shadow" x="40" y="115.5" width="200" height="36" rx="10"/>
<rect class="d-tile" x="40" y="114" width="200" height="36" rx="10"/>
<text class="d-title" x="140" y="136.5" text-anchor="middle">onBeforeMount</text>
<rect class="d-shadow" x="40" y="173.5" width="200" height="36" rx="10"/>
<rect class="d-tile d-tile-accent" x="40" y="172" width="200" height="36" rx="10"/>
<text class="d-title" x="140" y="194.5" text-anchor="middle">onMounted</text>
<rect class="d-shadow" x="40" y="283.5" width="200" height="36" rx="10"/>
<rect class="d-tile" x="40" y="282" width="200" height="36" rx="10"/>
<text class="d-title" x="140" y="304.5" text-anchor="middle">onBeforeUpdate</text>
<rect class="d-shadow" x="40" y="341.5" width="200" height="36" rx="10"/>
<rect class="d-tile" x="40" y="340" width="200" height="36" rx="10"/>
<text class="d-title" x="140" y="362.5" text-anchor="middle">onUpdated</text>
<rect class="d-shadow" x="40" y="451.5" width="200" height="36" rx="10"/>
<rect class="d-tile" x="40" y="450" width="200" height="36" rx="10"/>
