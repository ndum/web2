<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 364" role="img" aria-labelledby="p5c3-lifecycle-de-title p5c3-lifecycle-de-desc">
<title id="p5c3-lifecycle-de-title">Der Lebenszyklus einer Komponente</title>
<desc id="p5c3-lifecycle-de-desc">Eine Zeitachse von oben nach unten. Zuerst läuft setup, dann onBeforeMount, dann onMounted, ab hier steht die Komponente im DOM. Bei jeder Änderung des Zustands folgen onBeforeUpdate und onUpdated, ein Pfeil führt von onUpdated zurück zu onBeforeUpdate. Wenn die Komponente verschwindet, folgen onBeforeUnmount und onUnmounted. Rechts steht neben setup, dass dort der Zustand entsteht und es noch kein DOM gibt, neben onMounted, dass dort Fokus, Messen und Listener hingehören, neben den beiden Hooks für Updates, dass sie bei jeder Änderung laufen, und neben onUnmounted, dass dort Listener und Timer aufgeräumt werden.</desc>
<defs><marker id="p5c3-lifecycle-de-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fig-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<rect class="fig-box" x="70" y="20" width="170" height="34" rx="6"/>
<text class="fig-code" x="155" y="42" text-anchor="middle" style="font-size: 13px">setup</text>
<path class="fig-arrow" d="M 155 56 L 155 68" marker-end="url(#p5c3-lifecycle-de-head)"/>
<rect class="fig-box" x="70" y="70" width="170" height="34" rx="6"/>
<text class="fig-code" x="155" y="92" text-anchor="middle" style="font-size: 13px">onBeforeMount</text>
<path class="fig-arrow" d="M 155 106 L 155 118" marker-end="url(#p5c3-lifecycle-de-head)"/>
<rect class="fig-box fig-box-strong" x="70" y="120" width="170" height="34" rx="6"/>
<text class="fig-code" x="155" y="142" text-anchor="middle" style="font-size: 13px">onMounted</text>
<path class="fig-arrow" d="M 155 156 L 155 168" marker-end="url(#p5c3-lifecycle-de-head)"/>
<rect class="fig-box" x="70" y="170" width="170" height="34" rx="6" stroke-dasharray="5 4"/>
<text class="fig-code" x="155" y="192" text-anchor="middle" style="font-size: 13px">onBeforeUpdate</text>
<path class="fig-arrow" d="M 155 206 L 155 218" marker-end="url(#p5c3-lifecycle-de-head)"/>
<rect class="fig-box" x="70" y="220" width="170" height="34" rx="6" stroke-dasharray="5 4"/>
<text class="fig-code" x="155" y="242" text-anchor="middle" style="font-size: 13px">onUpdated</text>
<path class="fig-arrow" d="M 155 256 L 155 268" marker-end="url(#p5c3-lifecycle-de-head)"/>
<rect class="fig-box" x="70" y="270" width="170" height="34" rx="6"/>
<text class="fig-code" x="155" y="292" text-anchor="middle" style="font-size: 13px">onBeforeUnmount</text>
<path class="fig-arrow" d="M 155 306 L 155 318" marker-end="url(#p5c3-lifecycle-de-head)"/>
<rect class="fig-box fig-box-strong" x="70" y="320" width="170" height="34" rx="6"/>
<text class="fig-code" x="155" y="342" text-anchor="middle" style="font-size: 13px">onUnmounted</text>
<path class="fig-arrow" d="M 68 237 C 20 237, 20 187, 64 187" marker-end="url(#p5c3-lifecycle-de-head)"/>
<text class="fig-sub" x="264" y="34">Zustand anlegen,</text>
<text class="fig-sub" x="264" y="51">noch kein DOM</text>
<text class="fig-sub" x="264" y="134">DOM ist da, Fokus,</text>
<text class="fig-sub" x="264" y="151">Messen, Listener</text>
<text class="fig-sub" x="264" y="209">bei jeder Änderung</text>
<text class="fig-sub" x="264" y="226">des Zustands</text>
<text class="fig-sub" x="264" y="334">aufräumen, Listener</text>
<text class="fig-sub" x="264" y="351">und Timer entfernen</text>
</svg>
