<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 288" role="img" aria-labelledby="p7c4-lifetime-de-title p7c4-lifetime-de-desc">
<title id="p7c4-lifetime-de-title">Wie lange Daten im Browser bleiben</title>
<desc id="p7c4-lifetime-de-desc">Vier Balken über einem Zeitstrahl mit sechs nummerierten Ereignissen, Seite laden, neu laden, zweiter Tab, Tab schliessen, Browser schliessen und Browser öffnen. Ein Store im Speicher reicht bis zum Neuladen. sessionStorage bleibt beim Neuladen, gehört nur zu diesem Tab und endet, wenn er sich schliesst. Ein Cookie ohne Ablauf gilt für alle Tabs und endet, wenn der Browser schliesst. localStorage gilt für alle Tabs und ist nach dem nächsten Öffnen noch da.</desc>
<defs><marker id="p7c4-lifetime-de-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p7c4-lifetime-de-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p7c4-lifetime-de-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
