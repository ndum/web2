<rect class="d-fill-blue" x="180" y="75" width="216" height="16" rx="4"/>
<text class="d-sub" x="404" y="87" text-anchor="start">bis der Tab schliesst</text>
<text class="d-title-small" x="16" y="128" text-anchor="start">Cookie</text>
<text class="d-sub" x="16" y="143" text-anchor="start">ohne Ablauf, alle Tabs</text>
<rect class="d-fill-blue" x="180" y="123" width="288" height="16" rx="4"/>
<text class="d-sub" x="476" y="135" text-anchor="start">bis der Browser schliesst</text>
