<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 294" role="img" aria-labelledby="p7c4-lifetime-de-title p7c4-lifetime-de-desc">
<title id="p7c4-lifetime-de-title">Wie lange Daten im Browser bleiben</title>
<desc id="p7c4-lifetime-de-desc">Vier Balken über sechs Ereignisse: Seite laden, neu laden, zweiter Tab, Tab schliessen, Browser schliessen und Browser öffnen. Ein Store im Speicher reicht bis zum Neuladen. sessionStorage bleibt beim Neuladen, gehört nur zu diesem Tab und endet, wenn er sich schliesst. Ein Cookie ohne Ablauf gilt für alle Tabs und endet, wenn der Browser schliesst. localStorage gilt für alle Tabs und ist nach dem nächsten Öffnen noch da.</desc>
<defs><marker id="p7c4-lifetime-de-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fig-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<text class="fig-sub fig-strong" x="212" y="30" text-anchor="middle">Seite</text>
<text class="fig-sub fig-strong" x="212" y="47" text-anchor="middle">laden</text>
<path class="fig-arrow" d="M 212 56 L 212 66"/>
<text class="fig-sub fig-strong" x="296" y="30" text-anchor="middle">neu</text>
<text class="fig-sub fig-strong" x="296" y="47" text-anchor="middle">laden</text>
<path class="fig-arrow" d="M 296 56 L 296 66"/>
<text class="fig-sub fig-strong" x="380" y="30" text-anchor="middle">zweiter</text>
<text class="fig-sub fig-strong" x="380" y="47" text-anchor="middle">Tab</text>
<path class="fig-arrow" d="M 380 56 L 380 66"/>
<text class="fig-sub fig-strong" x="464" y="30" text-anchor="middle">Tab</text>
<text class="fig-sub fig-strong" x="464" y="47" text-anchor="middle">schliessen</text>
<path class="fig-arrow" d="M 464 56 L 464 66"/>
<text class="fig-sub fig-strong" x="548" y="30" text-anchor="middle">Browser</text>
<text class="fig-sub fig-strong" x="548" y="47" text-anchor="middle">schliessen</text>
<path class="fig-arrow" d="M 548 56 L 548 66"/>
<text class="fig-sub fig-strong" x="632" y="30" text-anchor="middle">Browser</text>
<text class="fig-sub fig-strong" x="632" y="47" text-anchor="middle">öffnen</text>
<path class="fig-arrow" d="M 632 56 L 632 66"/>
<text class="fig-text" x="20" y="95" style="font-size: 14px">Store</text>
<text class="fig-sub" x="20" y="112">im Speicher</text>
<rect class="fig-box fig-box-strong" x="212" y="82" width="84" height="30" rx="4"/>
<text class="fig-sub fig-strong" x="304" y="102">bis zum Neuladen</text>
<text class="fig-code fig-strong" x="20" y="149" style="font-size: 14px">sessionStorage</text>
<text class="fig-sub" x="20" y="166">nur dieser Tab</text>
<rect class="fig-box fig-box-strong" x="212" y="136" width="252" height="30" rx="4"/>
<text class="fig-sub fig-strong" x="222" y="156">bis der Tab schliesst</text>
<text class="fig-text" x="20" y="203" style="font-size: 14px">Cookie</text>
<text class="fig-sub" x="20" y="220">ohne Ablauf</text>
<rect class="fig-box fig-box-strong" x="212" y="190" width="336" height="30" rx="4"/>
<text class="fig-sub fig-strong" x="222" y="210">alle Tabs</text>
<text class="fig-code fig-strong" x="20" y="257" style="font-size: 14px">localStorage</text>
<text class="fig-sub" x="20" y="274">alle Tabs</text>
<rect class="fig-box fig-box-strong" x="212" y="244" width="462" height="30" rx="4"/>
<text class="fig-sub fig-strong" x="222" y="264">bleibt</text>
