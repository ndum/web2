<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 378" role="img" aria-labelledby="j6-objects-de-title j6-objects-de-desc">
<title id="j6-objects-de-title">Eine Klasse, zwei Objekte</title>
<desc id="j6-objects-de-desc">Links die Klasse Reservation als Bauplan mit dem Konstruktor, dem Getter days und der Methode toString. Zwei Pfeile mit new führen zu zwei Objekten. R-1 hält den Beamer für M-117 vom 2026-11-07 bis 2026-11-11, R-2 die Festbankgarnitur für M-117 vom 2026-11-07 bis 2026-11-14. Der Getter days liefert 4 Tage für R-1 und 7 Tage für R-2. Die Werte gehören jedem Objekt selbst, die Methoden und der Getter stehen nur einmal in der Klasse.</desc>
