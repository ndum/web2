<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img" aria-labelledby="p4c1-tree-de-title p4c1-tree-de-desc">
<title id="p4c1-tree-de-title">Der Baum der Komponenten aus dem Entwurf</title>
<desc id="p4c1-tree-de-desc">Links ein Entwurf der Seite mit dem Katalog. Der Kopf heisst AppHeader, das Suchfeld SearchBar, die Auswahl der Kategorie CategoryFilter, die Liste ItemList mit einer ItemCard für jedes Ding und der Fuss AppFooter. Rechts der Baum der ganzen App. App enthält AppHeader, CatalogView, ItemView und AppFooter. CatalogView enthält SearchBar, CategoryFilter und ItemList mit ItemCard, ItemView enthält ReservationForm und BaseDialog, AppFooter enthält OpeningHours. App besitzt Katalog, Favoriten, Suchtext und Kategorie, ReservationForm die Anfrage.</desc>
