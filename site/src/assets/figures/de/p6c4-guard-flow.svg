<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 648" role="img" aria-labelledby="p6c4-flow-de-title p6c4-flow-de-desc">
<title id="p6c4-flow-de-title">Der Ablauf einer Navigation</title>
<desc id="p6c4-flow-de-desc">Eine Folge von oben nach unten in zwei Bändern. Eine Navigation beginnt mit einem RouterLink oder router.push. Im Band der Guards laufen onBeforeRouteLeave in der Seite, die man verlässt, beforeEach für jede Navigation, beforeEnter nur beim Betreten einer Route, das Laden der Komponenten und beforeResolve. Im zweiten Band ist die Navigation bestätigt, afterEach läuft, und das DOM zeigt die neue Seite. Rechts führen Pfeile von einer Klammer um die Guards zu zwei Karten. Jeder Guard bricht die Navigation mit false ab und leitet mit einer Route auf eine neue Navigation um.</desc>
