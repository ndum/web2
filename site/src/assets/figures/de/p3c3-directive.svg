<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 192" role="img" aria-labelledby="p3c3-directive-de-title p3c3-directive-de-desc">
<title id="p3c3-directive-de-title">Die Teile einer Direktive</title>
<desc id="p3c3-directive-de-desc">Die Direktive v-on:click.prevent="reserve" in Teile zerlegt. v-on ist der Name der Direktive, click das Argument, prevent ein Modifikator und reserve der Wert, ein JavaScript-Ausdruck. Darunter die Kurzformen, @click.prevent="reserve" ist gleich v-on:click.prevent="reserve", und :href="link" ist gleich v-bind:href="link".</desc>
<defs><marker id="p3c3-directive-de-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p3c3-directive-de-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p3c3-directive-de-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="192" rx="14"/>
<rect class="d-shadow" x="16" y="17.5" width="112" height="48" rx="10"/>
<rect class="d-tile" x="16" y="16" width="112" height="48" rx="10"/>
<text class="d-title" x="72" y="37" text-anchor="middle">v-on</text>
<text class="d-sub" x="72" y="53" text-anchor="middle">Direktive</text>
<text class="d-title-small" x="142" y="37" text-anchor="middle">:</text>
<rect class="d-shadow" x="156" y="17.5" width="112" height="48" rx="10"/>
<rect class="d-tile" x="156" y="16" width="112" height="48" rx="10"/>
<text class="d-title" x="212" y="37" text-anchor="middle">click</text>
<text class="d-sub" x="212" y="53" text-anchor="middle">Argument</text>
<text class="d-title-small" x="282" y="37" text-anchor="middle">.</text>
<rect class="d-shadow" x="296" y="17.5" width="120" height="48" rx="10"/>
<rect class="d-tile" x="296" y="16" width="120" height="48" rx="10"/>
<text class="d-title" x="356" y="37" text-anchor="middle">prevent</text>
<text class="d-sub" x="356" y="53" text-anchor="middle">Modifikator</text>
<text class="d-title-small" x="430" y="37" text-anchor="middle">=</text>
<rect class="d-shadow" x="444" y="17.5" width="220" height="48" rx="10"/>
<rect class="d-tile d-tile-violet" x="444" y="16" width="220" height="48" rx="10"/>
<text class="d-title d-title-violet" x="554" y="37" text-anchor="middle">"reserve"</text>
<text class="d-sub" x="554" y="53" text-anchor="middle">Wert, ein JavaScript-Ausdruck</text>
<rect class="d-band d-band-1" x="16" y="88" width="648" height="88" rx="12"/>
<text class="d-label" x="32" y="112" text-anchor="start">KURZFORMEN</text>
<text class="d-code" x="296.625" y="138" text-anchor="end">@click.prevent="reserve"</text>
<text class="d-sub" x="340" y="138" text-anchor="middle">ist gleich</text>
<text class="d-code" x="383.375" y="138" text-anchor="start">v-on:click.prevent="reserve"</text>
<text class="d-code" x="296.625" y="162" text-anchor="end">:href="link"</text>
<text class="d-sub" x="340" y="162" text-anchor="middle">ist gleich</text>
<text class="d-code" x="383.375" y="162" text-anchor="start">v-bind:href="link"</text>
</svg>
