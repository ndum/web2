<title id="p6c2-url-de-title">Teile einer Adresse</title>
<desc id="p6c2-url-de-desc">Zwei Adressen, in ihre Teile zerlegt. Oben /items/6, davon ist /items/ der feste Teil der Route /items/:id und 6 der Parameter, den route.params.id als Text liefert. Unten /?q=säge&amp;category=Werkzeug&amp;sort=deposit, davon ist / der Pfad, und die Query besteht aus q, category und sort, die route.query.q, route.query.category und route.query.sort liefern.</desc>
