<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 304" role="img" aria-labelledby="p6c2-url-de-title p6c2-url-de-desc">
<title id="p6c2-url-de-title">Teile einer Adresse</title>
<desc id="p6c2-url-de-desc">Zwei Adressen in zwei Bändern, in ihre Teile zerlegt. Unter jedem Teil steht eine Klammer mit seinem Namen. Oben /items/6, davon ist /items/ der feste Teil der Route /items/:id und 6 der Parameter, den route.params.id als Text liefert. Unten /?q=säge&amp;category=Werkzeug&amp;sort=deposit, davon ist / der Pfad, und die Query besteht aus q, category und sort, die route.query.q, route.query.category und route.query.sort liefern.</desc>
<defs><marker id="p6c2-url-de-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p6c2-url-de-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p6c2-url-de-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="304" rx="14"/>
<rect class="d-band d-band-1" x="16" y="16" width="648" height="128" rx="12"/>
<text class="d-label" x="32" y="40" text-anchor="start">ADRESSE MIT PARAMETER</text>
<text class="d-code" x="219.88999999999996" y="40" text-anchor="start">/items/6</text>
<text class="d-code" x="101.5" y="76" text-anchor="middle">/items/</text>
<path class="d-line" d="M 35 84 L 35 90 L 168 90 L 168 84"/>
<path class="d-line" d="M 101.5 90 L 101.5 97"/>
<text class="d-title-small" x="101.5" y="112" text-anchor="middle">fester Teil der Route</text>
<text class="d-code" x="101.5" y="128" text-anchor="middle">/items/:id</text>
<text class="d-code" x="254.5" y="76" text-anchor="middle">6</text>
<path class="d-line d-line-accent" d="M 178 84 L 178 90 L 331 90 L 331 84"/>
<path class="d-line d-line-accent" d="M 254.5 90 L 254.5 97"/>
<text class="d-title-small" x="254.5" y="112" text-anchor="middle">Parameter</text>
<text class="d-code" x="254.5" y="128" text-anchor="middle">route.params.id = '6'</text>
<rect class="d-band d-band-2" x="16" y="160" width="648" height="128" rx="12"/>
<text class="d-label d-label-blue" x="32" y="184" text-anchor="start">ADRESSE MIT QUERY</text>
<text class="d-code" x="182.55599999999998" y="184" text-anchor="start">/?q=säge&amp;category=Werkzeug&amp;sort=deposit</text>
<text class="d-code" x="55.5" y="220" text-anchor="middle">/</text>
<path class="d-line" d="M 35 228 L 35 234 L 76 234 L 76 228"/>
<path class="d-line" d="M 55.5 234 L 55.5 241"/>
<text class="d-title-small" x="55.5" y="256" text-anchor="middle">Pfad</text>
<text class="d-code" x="136" y="220" text-anchor="middle">?q=säge</text>
<path class="d-line d-line-violet" d="M 86 228 L 86 234 L 186 234 L 186 228"/>
<path class="d-line d-line-violet" d="M 136 234 L 136 241"/>
<text class="d-title-small" x="136" y="256" text-anchor="middle">Query</text>
<text class="d-code" x="136" y="272" text-anchor="middle">route.query.q</text>
<text class="d-code" x="269" y="220" text-anchor="middle">&amp;category=Werkzeug</text>
<path class="d-line d-line-violet" d="M 196 228 L 196 234 L 342 234 L 342 228"/>
<path class="d-line d-line-violet" d="M 269 234 L 269 241"/>
<text class="d-title-small" x="269" y="256" text-anchor="middle">Query</text>
<text class="d-code" x="269" y="272" text-anchor="middle">route.query.category</text>
<text class="d-code" x="412" y="220" text-anchor="middle">&amp;sort=deposit</text>
<path class="d-line d-line-violet" d="M 352 228 L 352 234 L 472 234 L 472 228"/>
<path class="d-line d-line-violet" d="M 412 234 L 412 241"/>
<text class="d-title-small" x="412" y="256" text-anchor="middle">Query</text>
<text class="d-code" x="412" y="272" text-anchor="middle">route.query.sort</text>
</svg>
