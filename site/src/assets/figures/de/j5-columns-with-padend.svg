<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 442" role="img" aria-labelledby="j5-columns-de-title j5-columns-de-desc">
<title id="j5-columns-de-title">Spalten mit padEnd</title>
<desc id="j5-columns-de-desc">Oben drei Zeilen des Tresen-Helfers ohne Auffüllen, für die Bohrmaschine, das Zelt für vier Personen und den Beamer, je mit Nummer, Name, Pfand und dem Hinweis, ob das Ding da ist. Die Namen sind verschieden lang, darum beginnt der Betrag in jeder Zeile an einer anderen Stelle. Unten dieselben Zeilen mit padEnd. Es hängt an die Bohrmaschine 10 und an den Beamer 16 Leerzeichen an, bis jeder Name 22 Zeichen hat wie das Zelt. Jetzt stehen CHF 20, CHF 50 und CHF 80 genau untereinander.</desc>
