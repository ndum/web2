<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 282" role="img" aria-labelledby="p4c4-slots-de-title p4c4-slots-de-desc">
<title id="p4c4-slots-de-title">Inhalte füllen die Slots einer Komponente</title>
<desc id="p4c4-slots-de-desc">Links das Template der Elternkomponente mit BaseDialog. Sie füllt den Slot title mit dem Titel, den Standard-Slot mit dem Text der Anfrage und den Slot actions mit einem Knopf. Rechts das Template von BaseDialog mit den drei Stellen slot name title, slot und slot name actions. Pfeile verbinden jeden Inhalt mit seinem Slot.</desc>
<text class="fig-text" x="20" y="30">App.vue füllt die Slots</text>
<text class="fig-text" x="390" y="30">BaseDialog.vue zeigt sie an</text>
<rect class="fig-paper" x="20" y="42" width="290" height="232"/><path class="fig-line" d="M 22.3 40.9 Q 166.6 41.2 309.9 41.8 Q 310.9 158 309.8 273.5 Q 164.5 274.6 19.6 274.9 Q 22.1 158.4 20.5 41.5 Q 22.7 40.9 24.9 40.8 M 20.9 42.3 Q 165.6 43.2 309.3 42 Q 311.8 158.2 309.9 274.3 Q 165.7 274.3 20.3 274.4 Q 21.5 158.2 19 42.5 Q 22.7 42.4 26.8 42.8"/>
<rect class="fig-paper" x="390" y="42" width="270" height="232"/><path class="fig-line" d="M 392.5 42.9 Q 526.1 43.2 660.3 42 Q 659.9 157.5 660.1 273.2 Q 525.2 272.3 390.5 273.9 Q 393 157.9 390.7 43.3 Q 393.6 43.4 397.2 43.6 M 391.5 41.4 Q 525.9 43.3 661.1 42.9 Q 660.3 157.8 660.3 272.7 Q 524.4 273.9 389.2 273.9 Q 390.9 158.2 390.9 42 Q 394 42.8 397.1 42.8"/>
<text class="fig-code" x="32" y="66" xml:space="preserve">&lt;BaseDialog&gt;</text>
<text class="fig-code" x="32" y="90" xml:space="preserve">  &lt;template #title&gt;</text>
<text class="fig-code fig-strong" x="32" y="114" xml:space="preserve">    Anfrage prüfen</text>
<text class="fig-code" x="32" y="138" xml:space="preserve">  &lt;/template&gt;</text>
<text class="fig-code fig-strong" x="32" y="162" xml:space="preserve">  Bohrmaschine, 18. bis 21.11.</text>
<text class="fig-code" x="32" y="186" xml:space="preserve">  &lt;template #actions&gt;</text>
<text class="fig-code fig-strong" x="32" y="210" xml:space="preserve">    &lt;button&gt;Bestätigen&lt;/button&gt;</text>
<text class="fig-code" x="32" y="234" xml:space="preserve">  &lt;/template&gt;</text>
<text class="fig-code" x="32" y="258" xml:space="preserve">&lt;/BaseDialog&gt;</text>
<text class="fig-code" x="402" y="66" xml:space="preserve">&lt;div role="dialog"&gt;</text>
