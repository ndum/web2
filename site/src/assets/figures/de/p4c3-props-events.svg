<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="p4c3-events-de-title p4c3-events-de-desc">
<title id="p4c3-events-de-title">Props nach unten, Events nach oben</title>
<desc id="p4c3-events-de-desc">Oben steht App. Links darunter ItemCard, App gibt ihr mit Props den Namen und die Verfügbarkeit, die Karte meldet mit dem Event reserve die id zurück. Rechts darunter SearchBar, App gibt ihr den Wert modelValue, das Suchfeld meldet Änderungen mit dem Event update:modelValue. v-model verbindet beides.</desc>
<defs><marker id="p4c3-events-de-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fig-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<rect class="fig-box fig-box-strong" x="60" y="20" width="600" height="54" rx="10"/>
<text class="fig-text" x="360" y="44" text-anchor="middle">App.vue</text>
<text class="fig-sub" x="360" y="64" text-anchor="middle">besitzt die Daten</text>
<rect class="fig-box" x="110" y="200" width="190" height="52" rx="10"/>
<text class="fig-text" x="205" y="231" text-anchor="middle">ItemCard.vue</text>
<path class="fig-arrow" d="M 165 76 L 165 196" marker-end="url(#p4c3-events-de-head)"/>
<path class="fig-arrow" d="M 245 198 L 245 78" marker-end="url(#p4c3-events-de-head)"/>
<text class="fig-sub fig-strong" x="158" y="126" text-anchor="end">Props</text>
<text class="fig-code" x="158" y="144" text-anchor="end">:name, :available</text>
<text class="fig-sub fig-strong" x="252" y="126">Events</text>
<text class="fig-code" x="252" y="144">@reserve(id)</text>
<text class="fig-sub fig-note" x="205" y="278" text-anchor="middle">Daten fliessen nach unten, Meldungen nach oben.</text>
<rect class="fig-box" x="420" y="200" width="190" height="52" rx="10"/>
<text class="fig-text" x="515" y="231" text-anchor="middle">SearchBar.vue</text>
<path class="fig-arrow" d="M 475 76 L 475 196" marker-end="url(#p4c3-events-de-head)"/>
<path class="fig-arrow" d="M 555 198 L 555 78" marker-end="url(#p4c3-events-de-head)"/>
<text class="fig-sub fig-strong" x="468" y="126" text-anchor="end">Props</text>
<text class="fig-code" x="468" y="144" text-anchor="end">modelValue</text>
<text class="fig-sub fig-strong" x="562" y="126">Events</text>
<text class="fig-code" x="562" y="144">update:modelValue</text>
<text class="fig-sub fig-note" x="515" y="278" text-anchor="middle">v-model verbindet beide Richtungen</text>
