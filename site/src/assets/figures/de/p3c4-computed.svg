<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-labelledby="p3c4-computed-de-title p3c4-computed-de-desc">
<title id="p3c4-computed-de-title">Abhängigkeiten der berechneten Werte im Katalog</title>
<desc id="p3c4-computed-de-desc">Links stehen die Daten items und die Refs query und onlyAvailable. Der berechnete Wert visibleItems liest alle drei, availableCount liest nur items. Das Template zeigt die Liste aus visibleItems und die Zahl aus availableCount. Ändert sich query, rechnet Vue nur visibleItems neu und aktualisiert die Liste.</desc>
<defs><marker id="p3c4-computed-de-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fig-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<rect class="fig-box" x="20" y="20" width="190" height="60" rx="8"/>
<text class="fig-text" x="115" y="46" text-anchor="middle">items</text>
<text class="fig-sub" x="115" y="65" text-anchor="middle">die Dinge des Katalogs</text>
<rect class="fig-box fig-box-strong" x="20" y="100" width="190" height="60" rx="8"/>
<text class="fig-text" x="115" y="126" text-anchor="middle">query</text>
<text class="fig-sub" x="115" y="145" text-anchor="middle">ref, Text im Suchfeld</text>
<rect class="fig-box fig-box-strong" x="20" y="180" width="190" height="60" rx="8"/>
<text class="fig-text" x="115" y="206" text-anchor="middle">onlyAvailable</text>
<text class="fig-sub" x="115" y="225" text-anchor="middle">ref, nur verfügbare</text>
<rect class="fig-box fig-box-strong" x="250" y="50" width="170" height="60" rx="8"/>
<text class="fig-text" x="335" y="76" text-anchor="middle">visibleItems</text>
<text class="fig-sub" x="335" y="95" text-anchor="middle">computed</text>
<rect class="fig-box fig-box-strong" x="250" y="160" width="170" height="60" rx="8"/>
<text class="fig-text" x="335" y="186" text-anchor="middle">availableCount</text>
<text class="fig-sub" x="335" y="205" text-anchor="middle">computed</text>
<rect class="fig-box" x="456" y="50" width="210" height="170" rx="8"/>
<text class="fig-text" x="561" y="80" text-anchor="middle">Template</text>
<text class="fig-code" x="468" y="112" xml:space="preserve">&lt;li v-for="item in</text>
<text class="fig-code" x="468" y="130" xml:space="preserve">  visibleItems"&gt;</text>
<text class="fig-code" x="468" y="190">{{ availableCount }} von …</text>
<path class="fig-arrow" d="M 212 50 L 246 72" marker-end="url(#p3c4-computed-de-head)"/>
<path class="fig-arrow" d="M 212 130 L 246 84" marker-end="url(#p3c4-computed-de-head)"/>
<path class="fig-arrow" d="M 212 210 L 246 96" marker-end="url(#p3c4-computed-de-head)"/>
<path class="fig-arrow" d="M 212 56 L 246 182" marker-end="url(#p3c4-computed-de-head)"/>
<path class="fig-arrow" d="M 422 80 L 452 112" marker-end="url(#p3c4-computed-de-head)"/>
<path class="fig-arrow" d="M 422 190 L 452 186" marker-end="url(#p3c4-computed-de-head)"/>
<text class="fig-sub fig-note" x="340" y="276" text-anchor="middle">Ändert sich query, rechnet Vue nur visibleItems neu und zeichnet die Liste neu.</text>
</svg>
