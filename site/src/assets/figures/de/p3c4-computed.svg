<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 382" role="img" aria-labelledby="p3c4-computed-de-title p3c4-computed-de-desc">
<title id="p3c4-computed-de-title">Abhängigkeiten der berechneten Werte im Katalog</title>
<desc id="p3c4-computed-de-desc">Links stehen die Daten items und die Refs query und onlyAvailable. Der berechnete Wert visibleItems liest alle drei, availableCount liest nur items. Das Template zeigt die Liste aus visibleItems und die Zahl aus availableCount. Ändert sich query, rechnet Vue nur visibleItems neu und aktualisiert die Liste.</desc>
<defs><marker id="p3c4-computed-de-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p3c4-computed-de-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p3c4-computed-de-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="382" rx="14"/>
<rect class="d-band d-band-1" x="16" y="16" width="192" height="296" rx="12"/>
<text class="d-label" x="32" y="40" text-anchor="start">DATEN UND REFS</text>
<rect class="d-band d-band-2" x="224" y="16" width="176" height="296" rx="12"/>
