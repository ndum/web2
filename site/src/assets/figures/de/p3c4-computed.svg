<path class="d-arrow" d="M 192 140 L 236 140" marker-end="url(#p3c4-computed-de-head)"/>
<path class="d-arrow" d="M 192 200 L 236 200" marker-end="url(#p3c4-computed-de-head)"/>
<path class="d-arrow" d="M 112 225.5 L 112 272 L 236 272" marker-end="url(#p3c4-computed-de-head)"/>
<path class="d-arrow d-arrow-accent" d="M 384 140 L 428 140" marker-end="url(#p3c4-computed-de-head-accent)"/>
