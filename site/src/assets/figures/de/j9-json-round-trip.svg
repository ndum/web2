<title id="j9-json-de-title">Eine Reservation durch JSON und zurück</title>
<desc id="j9-json-de-desc">Oben die Reservation als Objekt mit den Feldern itemId 6, member M-117, from als Date für den 7. November 2026, days 4 und note mit dem Wert undefined. JSON.stringify macht daraus einen einzigen String. Darin steht from als Text im Format ISO 8601, und note fehlt. JSON.parse liest den String als neues Objekt. Dort ist from ein String und kein Date mehr, und das Feld note gibt es nicht.</desc>
