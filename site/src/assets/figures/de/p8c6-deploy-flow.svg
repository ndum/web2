<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 410" role="img" aria-labelledby="p8c6-deploy-de-title p8c6-deploy-de-desc">
<title id="p8c6-deploy-de-title">Vom Push zur veröffentlichten App</title>
<desc id="p8c6-deploy-de-desc">Ein Ablauf von oben nach unten. Ein Push auf main startet einen Workflow von GitHub Actions, der die Pakete mit npm ci installiert, die Tests mit npm test ausführt und mit npm run build baut. Schlägt ein Test fehl, endet der Workflow, und nichts geht online. Der Ordner dist geht als Artefakt an GitHub Pages, das die App unter name.github.io/lorraine-commons/ ausliefert. Rechts zweigt eine Adresse ab, die GitHub Pages nicht kennt, etwa /lorraine-commons/items/6. Dafür liefert Pages die Datei 404.html, eine Kopie von index.html, und der Router zeigt die Seite des Dings.</desc>
