<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 338" role="img" aria-labelledby="j4-object-de-title j4-object-de-desc">
<title id="j4-object-de-title">Ein Ding als Objekt im Array</title>
<desc id="j4-object-de-desc">Links ein Objekt für den Raclette-Ofen mit den Schlüsseln id, name, deposit und availableFrom und ihren Werten 3, Raclette-Ofen, 30 und null. Ein Pfeil führt in ein Array mit den neun Dingen des Katalogs. Das Objekt steht dort an der dritten Stelle, items[2], nach der Bohrmaschine in items[0] und dem Zelt für vier Personen in items[1]. Die übrigen sechs Dinge stehen in items[3] bis items[8].</desc>
