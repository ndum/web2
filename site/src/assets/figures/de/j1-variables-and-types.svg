<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 394" role="img" aria-labelledby="j1-variables-de-title j1-variables-de-desc">
<title id="j1-variables-de-title">Variablen mit Wert und Typ</title>
<desc id="j1-variables-de-desc">Links stehen die Variablen name, deposit, availableFrom, daysField und days, rechts ihre Werte mit dem Typ. name enthält den Text 'Bohrmaschine', deposit die Zahl 20 und availableFrom den Wert null. daysField enthält den Text '4' aus einem Formularfeld. Ein Pfeil mit Number(daysField) führt von diesem Text zu days, das die Zahl 4 enthält.</desc>
