<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 438" role="img" aria-labelledby="p6c3-tree-de-title p6c3-tree-de-desc">
<title id="p6c3-tree-de-title">Die Routen der Fallbeispiel-App</title>
<desc id="p6c3-tree-de-desc">Ein Baum mit App und ihrer RouterView oben. Darunter hängen die Routen / mit CatalogView, /items/:id mit ItemView, /favorites mit FavoritesView, /association mit AssociationView, /login mit LoginView, die Catch-all-Route mit NotFoundView und /team mit TeamLayout. TeamLayout hat eine eigene RouterView mit den Kindrouten für die Ausleihen und die Rückgaben. Die Karte von /team trägt die Marke nur Team, die drei Karten des Teams sind gestrichelt, weil sie erst bei Bedarf laden, und neben der Catch-all-Route steht, dass sie alle anderen Adressen fängt.</desc>
