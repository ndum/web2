<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 324" role="img" aria-labelledby="p4c5-provide-en-title p4c5-provide-en-desc">
<title id="p4c5-provide-en-title">Passing props down or provide and inject</title>
<desc id="p4c5-provide-en-desc">On the left, App passes the member as a prop to ItemView, and ItemView passes it on to ReservationForm, although ItemView does not need it itself. On the right, App provides the member with provide, and ReservationForm gets it with inject, without ItemView knowing about it.</desc>
