<title id="j6-objects-en-title">One class, two objects</title>
<desc id="j6-objects-en-desc">On the left the class Reservation as a blueprint with the constructor, the getter days and the method toString. Two arrows marked new lead to two objects. R-1 holds the projector for M-117 from 2026-11-07 to 2026-11-11, R-2 the beer bench set for M-117 from 2026-11-07 to 2026-11-14. The getter days gives 4 days for R-1 and 7 days for R-2. The values belong to each object, while the methods and the getter exist only once, in the class.</desc>
