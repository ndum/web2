<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-labelledby="p8c6-deploy-en-title p8c6-deploy-en-desc">
<title id="p8c6-deploy-en-title">From a push to the published app</title>
<desc id="p8c6-deploy-en-desc">A flow from top to bottom in two areas, GitHub Actions and GitHub Pages. A push to main starts a workflow that installs the packages with npm ci, runs the tests with npm test and builds with npm run build. If a test fails, the workflow ends and nothing goes online. The folder dist goes to GitHub Pages as an artifact, and Pages serves the app at name.github.io/lorraine-commons/. On the right, an address that GitHub Pages does not know branches off, such as /lorraine-commons/items/6. For it, Pages serves the file 404.html, a copy of index.html, and the router shows the page of the thing.</desc>
