<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 192" role="img" aria-labelledby="p3c3-directive-en-title p3c3-directive-en-desc">
<title id="p3c3-directive-en-title">The parts of a directive</title>
<desc id="p3c3-directive-en-desc">The directive v-on:click.prevent="reserve" split into its parts. v-on is the name of the directive, click the argument, prevent a modifier and reserve the value, a JavaScript expression. Below, the shorthands, @click.prevent="reserve" equals v-on:click.prevent="reserve", and :href="link" equals v-bind:href="link".</desc>
<defs><marker id="p3c3-directive-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p3c3-directive-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p3c3-directive-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="192" rx="14"/>
<rect class="d-shadow" x="16" y="17.5" width="112" height="48" rx="10"/>
<rect class="d-tile" x="16" y="16" width="112" height="48" rx="10"/>
<text class="d-title" x="72" y="37" text-anchor="middle">v-on</text>
<text class="d-sub" x="72" y="53" text-anchor="middle">directive</text>
<text class="d-title-small" x="142" y="37" text-anchor="middle">:</text>
<rect class="d-shadow" x="156" y="17.5" width="112" height="48" rx="10"/>
<rect class="d-tile" x="156" y="16" width="112" height="48" rx="10"/>
<text class="d-title" x="212" y="37" text-anchor="middle">click</text>
<text class="d-sub" x="212" y="53" text-anchor="middle">argument</text>
<text class="d-title-small" x="282" y="37" text-anchor="middle">.</text>
<rect class="d-shadow" x="296" y="17.5" width="120" height="48" rx="10"/>
<rect class="d-tile" x="296" y="16" width="120" height="48" rx="10"/>
<text class="d-title" x="356" y="37" text-anchor="middle">prevent</text>
<text class="d-sub" x="356" y="53" text-anchor="middle">modifier</text>
<text class="d-title-small" x="430" y="37" text-anchor="middle">=</text>
<rect class="d-shadow" x="444" y="17.5" width="220" height="48" rx="10"/>
<rect class="d-tile d-tile-violet" x="444" y="16" width="220" height="48" rx="10"/>
<text class="d-title d-title-violet" x="554" y="37" text-anchor="middle">"reserve"</text>
<text class="d-sub" x="554" y="53" text-anchor="middle">value, a JavaScript expression</text>
<rect class="d-band d-band-1" x="16" y="88" width="648" height="88" rx="12"/>
<text class="d-label" x="32" y="112" text-anchor="start">SHORTHANDS</text>
<text class="d-code" x="303.225" y="138" text-anchor="end">@click.prevent="reserve"</text>
<text class="d-sub" x="340" y="138" text-anchor="middle">equals</text>
<text class="d-code" x="376.775" y="138" text-anchor="start">v-on:click.prevent="reserve"</text>
<text class="d-code" x="303.225" y="162" text-anchor="end">:href="link"</text>
<text class="d-sub" x="340" y="162" text-anchor="middle">equals</text>
<text class="d-code" x="376.775" y="162" text-anchor="start">v-bind:href="link"</text>
</svg>
