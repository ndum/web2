<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 302" role="img" aria-labelledby="p8c3-status-en-title p8c3-status-en-desc">
<title id="p8c3-status-en-title">The status of an architecture decision</title>
<desc id="p8c3-status-en-desc">A state diagram with the three columns Start, Decision and Later. A decision starts as proposed and is accepted or rejected. An accepted decision can later become deprecated or be superseded by a new decision that points to it. No decision is deleted, it keeps its number and stays in the index.</desc>
<defs><marker id="p8c3-status-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p8c3-status-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p8c3-status-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="302" rx="14"/>
<rect class="d-band d-band-1" x="16" y="16" width="188" height="224" rx="12"/>
<text class="d-label" x="32" y="40" text-anchor="start">START</text>
<rect class="d-band d-band-2" x="228" y="16" width="188" height="224" rx="12"/>
<text class="d-label d-label-blue" x="244" y="40" text-anchor="start">DECISION</text>
<rect class="d-band d-band-1" x="440" y="16" width="224" height="224" rx="12"/>
<text class="d-label" x="456" y="40" text-anchor="start">LATER</text>
<path class="d-arrow" d="M 188 140 L 216 140 L 216 76 L 240 76" marker-end="url(#p8c3-status-en-head)"/>
<path class="d-arrow" d="M 188 140 L 216 140 L 216 204 L 240 204" marker-end="url(#p8c3-status-en-head)"/>
<path class="d-arrow" d="M 400 76 L 452 76" marker-end="url(#p8c3-status-en-head)"/>
<path class="d-arrow" d="M 400 76 L 428 76 L 428 140 L 452 140" marker-end="url(#p8c3-status-en-head)"/>
<rect class="d-shadow" x="32" y="121.5" width="156" height="40" rx="10"/>
<rect class="d-tile" x="32" y="120" width="156" height="40" rx="10"/>
<g class="d-icon" transform="translate(44 131) scale(0.75)"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></g>
<text class="d-title" x="72" y="144.5" text-anchor="start">Proposed</text>
<rect class="d-shadow" x="244" y="57.5" width="156" height="40" rx="10"/>
<rect class="d-tile d-tile-accent" x="244" y="56" width="156" height="40" rx="10"/>
<g class="d-icon d-icon-accent" transform="translate(256 67) scale(0.75)"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></g>
<text class="d-title" x="284" y="80.5" text-anchor="start">Accepted</text>
<rect class="d-shadow" x="244" y="185.5" width="156" height="40" rx="10"/>
<rect class="d-tile" x="244" y="184" width="156" height="40" rx="10"/>
<g class="d-icon" transform="translate(256 195) scale(0.75)"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
<text class="d-title" x="284" y="208.5" text-anchor="start">Rejected</text>
<rect class="d-shadow" x="456" y="57.5" width="192" height="40" rx="10"/>
<rect class="d-tile" x="456" y="56" width="192" height="40" rx="10"/>
<g class="d-icon" transform="translate(468 67) scale(0.75)"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
<text class="d-title" x="496" y="80.5" text-anchor="start">Deprecated</text>
<rect class="d-shadow" x="456" y="121.5" width="192" height="40" rx="10"/>
<rect class="d-tile" x="456" y="120" width="192" height="40" rx="10"/>
<g class="d-icon" transform="translate(468 131) scale(0.75)"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></g>
<text class="d-title" x="496" y="144.5" text-anchor="start">Superseded by ADR n</text>
<rect class="d-strip" x="16" y="256" width="648" height="30" rx="8"/>
<text class="d-sub" x="340" y="275" text-anchor="middle">No decision is deleted, the number stays.</text>
</svg>
