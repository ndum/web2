<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 304" role="img" aria-labelledby="p6c2-url-en-title p6c2-url-en-desc">
<title id="p6c2-url-en-title">Parts of an address</title>
<desc id="p6c2-url-en-desc">Two addresses in two bands, taken apart. Below each part a bracket carries its name. At the top /items/6, where /items/ is the fixed part of the route /items/:id and 6 is the param that route.params.id returns as a string. At the bottom /?q=saw&amp;category=Tools&amp;sort=deposit, where / is the path, and the query consists of q, category and sort, returned by route.query.q, route.query.category and route.query.sort.</desc>
<defs><marker id="p6c2-url-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p6c2-url-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p6c2-url-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="304" rx="14"/>
<rect class="d-band d-band-1" x="16" y="16" width="648" height="128" rx="12"/>
<text class="d-label" x="32" y="40" text-anchor="start">ADDRESS WITH A PARAM</text>
<text class="d-code" x="206.65039999999996" y="40" text-anchor="start">/items/6</text>
<text class="d-code" x="103.5" y="76" text-anchor="middle">/items/</text>
<path class="d-line" d="M 35 84 L 35 90 L 172 90 L 172 84"/>
<path class="d-line" d="M 103.5 90 L 103.5 97"/>
<text class="d-title-small" x="103.5" y="112" text-anchor="middle">fixed part of the route</text>
<text class="d-code" x="103.5" y="128" text-anchor="middle">/items/:id</text>
<text class="d-code" x="258.5" y="76" text-anchor="middle">6</text>
<path class="d-line d-line-accent" d="M 182 84 L 182 90 L 335 90 L 335 84"/>
<path class="d-line d-line-accent" d="M 258.5 90 L 258.5 97"/>
<text class="d-title-small" x="258.5" y="112" text-anchor="middle">param</text>
<text class="d-code" x="258.5" y="128" text-anchor="middle">route.params.id = '6'</text>
<rect class="d-band d-band-2" x="16" y="160" width="648" height="128" rx="12"/>
<text class="d-label d-label-blue" x="32" y="184" text-anchor="start">ADDRESS WITH A QUERY</text>
<text class="d-code" x="204.55159999999998" y="184" text-anchor="start">/?q=saw&amp;category=Tools&amp;sort=deposit</text>
<text class="d-code" x="54.5" y="220" text-anchor="middle">/</text>
<path class="d-line" d="M 35 228 L 35 234 L 74 234 L 74 228"/>
<path class="d-line" d="M 54.5 234 L 54.5 241"/>
<text class="d-title-small" x="54.5" y="256" text-anchor="middle">path</text>
<text class="d-code" x="134" y="220" text-anchor="middle">?q=saw</text>
<path class="d-line d-line-violet" d="M 84 228 L 84 234 L 184 234 L 184 228"/>
<path class="d-line d-line-violet" d="M 134 234 L 134 241"/>
<text class="d-title-small" x="134" y="256" text-anchor="middle">query</text>
<text class="d-code" x="134" y="272" text-anchor="middle">route.query.q</text>
<text class="d-code" x="267" y="220" text-anchor="middle">&amp;category=Tools</text>
<path class="d-line d-line-violet" d="M 194 228 L 194 234 L 340 234 L 340 228"/>
<path class="d-line d-line-violet" d="M 267 234 L 267 241"/>
<text class="d-title-small" x="267" y="256" text-anchor="middle">query</text>
<text class="d-code" x="267" y="272" text-anchor="middle">route.query.category</text>
<text class="d-code" x="410" y="220" text-anchor="middle">&amp;sort=deposit</text>
<path class="d-line d-line-violet" d="M 350 228 L 350 234 L 470 234 L 470 228"/>
<path class="d-line d-line-violet" d="M 410 234 L 410 241"/>
<text class="d-title-small" x="410" y="256" text-anchor="middle">query</text>
<text class="d-code" x="410" y="272" text-anchor="middle">route.query.sort</text>
</svg>
