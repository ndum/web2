<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544.404 262" role="img" aria-labelledby="p6c2-url-en-title p6c2-url-en-desc">
<title id="p6c2-url-en-title">Parts of an address</title>
<desc id="p6c2-url-en-desc">Two addresses taken apart. At the top /items/6, where /items/ is the fixed part of the route /items/:id and 6 is the param that route.params.id returns as a string. At the bottom /?q=saw&amp;category=Tools&amp;sort=deposit, where / is the path, and the query consists of q, category and sort, returned by route.query.q, route.query.category and route.query.sort.</desc>
<defs><marker id="p6c2-url-en-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fig-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<rect class="fig-box fig-box-strong" x="20" y="30" width="185" height="40" rx="4"/>
<text class="fig-code fig-strong" x="112.5" y="55" text-anchor="middle" style="font-size: 14px">/items/</text>
<path class="fig-arrow" d="M 112.5 72 L 112.5 88"/>
<text class="fig-sub" x="112.5" y="104" text-anchor="middle">fixed part of the route</text>
<text class="fig-code" x="112.5" y="122" text-anchor="middle">/items/:id</text>
<rect class="fig-box fig-box-strong" x="211" y="30" width="179.316" height="40" rx="4"/>
<text class="fig-code fig-strong" x="300.658" y="55" text-anchor="middle" style="font-size: 14px">6</text>
<path class="fig-arrow" d="M 300.658 72 L 300.658 88"/>
<text class="fig-sub" x="300.658" y="104" text-anchor="middle">param</text>
<text class="fig-code" x="300.658" y="122" text-anchor="middle">route.params.id = '6'</text>
<rect class="fig-box fig-box-strong" x="20" y="150" width="52" height="40" rx="4"/>
<text class="fig-code fig-strong" x="46" y="175" text-anchor="middle" style="font-size: 14px">/</text>
<path class="fig-arrow" d="M 46 192 L 46 208"/>
<text class="fig-sub" x="46" y="224" text-anchor="middle">path</text>
<rect class="fig-box fig-box-strong" x="78" y="150" width="120.148" height="40" rx="4"/>
<text class="fig-code fig-strong" x="138.074" y="175" text-anchor="middle" style="font-size: 14px">?q=saw</text>
<path class="fig-arrow" d="M 138.074 192 L 138.074 208"/>
<text class="fig-sub" x="138.074" y="224" text-anchor="middle">query</text>
<text class="fig-code" x="138.074" y="242" text-anchor="middle">route.query.q</text>
<rect class="fig-box fig-box-strong" x="204.148" y="150" width="171.92" height="40" rx="4"/>
<text class="fig-code fig-strong" x="290.108" y="175" text-anchor="middle" style="font-size: 14px">&amp;category=Tools</text>
<path class="fig-arrow" d="M 290.108 192 L 290.108 208"/>
<text class="fig-sub" x="290.108" y="224" text-anchor="middle">query</text>
<text class="fig-code" x="290.108" y="242" text-anchor="middle">route.query.category</text>
<rect class="fig-box fig-box-strong" x="382.068" y="150" width="142.336" height="40" rx="4"/>
<text class="fig-code fig-strong" x="453.236" y="175" text-anchor="middle" style="font-size: 14px">&amp;sort=deposit</text>
<path class="fig-arrow" d="M 453.236 192 L 453.236 208"/>
<text class="fig-sub" x="453.236" y="224" text-anchor="middle">query</text>
<text class="fig-code" x="453.236" y="242" text-anchor="middle">route.query.sort</text>
</svg>
