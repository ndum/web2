<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 648" role="img" aria-labelledby="p6c4-flow-en-title p6c4-flow-en-desc">
<title id="p6c4-flow-en-title">The navigation flow</title>
<desc id="p6c4-flow-en-desc">A sequence from top to bottom in two bands. A navigation starts with a RouterLink or router.push. In the band of the guards, onBeforeRouteLeave runs in the page being left, beforeEach for every navigation, beforeEnter only when a route is entered, the components are loaded and beforeResolve runs. In the second band the navigation is confirmed, afterEach runs and the DOM shows the new page. On the right, arrows lead from a bracket around the guards to two cards. Every guard cancels the navigation with false and redirects to a new navigation with a route.</desc>
<defs><marker id="p6c4-flow-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p6c4-flow-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p6c4-flow-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="648" rx="14"/>
<rect class="d-band d-band-2" x="16" y="82" width="648" height="328" rx="12"/>
<text class="d-label d-label-blue" x="32" y="104" text-anchor="start">GUARDS</text>
<rect class="d-band d-band-1" x="16" y="424" width="648" height="208" rx="12"/>
<text class="d-label" x="32" y="446" text-anchor="start">CONFIRMED</text>
<path class="d-arrow" d="M 182 61.5 L 182 110" marker-end="url(#p6c4-flow-en-head)"/>
<path class="d-arrow" d="M 182 159.5 L 182 170" marker-end="url(#p6c4-flow-en-head)"/>
<path class="d-arrow" d="M 182 219.5 L 182 230" marker-end="url(#p6c4-flow-en-head)"/>
<path class="d-arrow" d="M 182 279.5 L 182 290" marker-end="url(#p6c4-flow-en-head)"/>
<path class="d-arrow" d="M 182 339.5 L 182 350" marker-end="url(#p6c4-flow-en-head)"/>
<path class="d-arrow" d="M 182 399.5 L 182 452" marker-end="url(#p6c4-flow-en-head)"/>
<path class="d-arrow" d="M 182 501.5 L 182 512" marker-end="url(#p6c4-flow-en-head)"/>
<path class="d-arrow" d="M 182 561.5 L 182 572" marker-end="url(#p6c4-flow-en-head)"/>
<path class="d-line d-line-accent" d="M 340 136 L 350 136 L 350 376 L 340 376"/>
<path class="d-arrow d-arrow-accent" d="M 350 224 L 408 224" marker-end="url(#p6c4-flow-en-head-accent)"/>
<path class="d-arrow d-arrow-accent" d="M 350 288 L 408 288" marker-end="url(#p6c4-flow-en-head-accent)"/>
<rect class="d-shadow" x="412" y="203.5" width="236" height="44" rx="10"/>
<rect class="d-tile" x="412" y="202" width="236" height="44" rx="10"/>
<g class="d-icon" transform="translate(424 215) scale(0.75)"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
<text class="d-title" x="452" y="221" text-anchor="start">Navigation cancelled</text>
<text class="d-code" x="452" y="237" text-anchor="start">return false</text>
<rect class="d-shadow" x="412" y="267.5" width="236" height="44" rx="10"/>
<rect class="d-tile" x="412" y="266" width="236" height="44" rx="10"/>
<g class="d-icon" transform="translate(424 279) scale(0.75)"><path d="M12 3v18M5 5.5h11l2.5 2.5-2.5 2.5H5zM19 13H8l-2.5 2.5L8 18h11z"/></g>
<text class="d-title" x="452" y="285" text-anchor="start">Redirect, new navigation</text>
<text class="d-code" x="452" y="301" text-anchor="start">return { name: … }</text>
<rect class="d-shadow" x="32" y="17.5" width="300" height="44" rx="10"/>
<rect class="d-tile" x="32" y="16" width="300" height="44" rx="10"/>
<g class="d-icon" transform="translate(44 29) scale(0.75)"><path d="M5.5 3.5 18 10l-5.6 1.8L10 17.5z"/><path d="M12.4 11.8 17 18.5"/></g>
<text class="d-title" x="72" y="35" text-anchor="start">Navigation starts</text>
<text class="d-sub" x="72" y="51" text-anchor="start">RouterLink, router.push</text>
<rect class="d-shadow" x="32" y="115.5" width="300" height="44" rx="10"/>
<rect class="d-tile" x="32" y="114" width="300" height="44" rx="10"/>
<g class="d-icon" transform="translate(44 127) scale(0.75)"><path d="M12 3 19 6v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6z"/></g>
<text class="d-title" x="72" y="133" text-anchor="start">onBeforeRouteLeave</text>
<text class="d-sub" x="72" y="149" text-anchor="start">in the page being left</text>
<rect class="d-shadow" x="32" y="175.5" width="300" height="44" rx="10"/>
<rect class="d-tile" x="32" y="174" width="300" height="44" rx="10"/>
<g class="d-icon" transform="translate(44 187) scale(0.75)"><path d="M12 3 19 6v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6z"/></g>
<text class="d-title" x="72" y="193" text-anchor="start">beforeEach</text>
<text class="d-sub" x="72" y="209" text-anchor="start">global, on every navigation</text>
<rect class="d-shadow" x="32" y="235.5" width="300" height="44" rx="10"/>
<rect class="d-tile" x="32" y="234" width="300" height="44" rx="10"/>
<g class="d-icon" transform="translate(44 247) scale(0.75)"><path d="M12 3 19 6v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6z"/></g>
<text class="d-title" x="72" y="253" text-anchor="start">beforeEnter</text>
<text class="d-sub" x="72" y="269" text-anchor="start">only when entering the route</text>
<rect class="d-shadow" x="32" y="295.5" width="300" height="44" rx="10"/>
<rect class="d-tile d-tile-violet" x="32" y="294" width="300" height="44" rx="10"/>
<g class="d-icon d-icon-violet" transform="translate(44 307) scale(0.75)"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 6l-3 12"/></g>
<text class="d-title d-title-violet" x="72" y="313" text-anchor="start">Components load</text>
<text class="d-sub" x="72" y="329" text-anchor="start">routes with import()</text>
<rect class="d-shadow" x="32" y="355.5" width="300" height="44" rx="10"/>
<rect class="d-tile" x="32" y="354" width="300" height="44" rx="10"/>
<g class="d-icon" transform="translate(44 367) scale(0.75)"><path d="M12 3 19 6v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6z"/></g>
<text class="d-title" x="72" y="373" text-anchor="start">beforeResolve</text>
<text class="d-sub" x="72" y="389" text-anchor="start">global, right before confirming</text>
<rect class="d-shadow" x="32" y="457.5" width="300" height="44" rx="10"/>
<rect class="d-tile" x="32" y="456" width="300" height="44" rx="10"/>
<g class="d-icon" transform="translate(44 469) scale(0.75)"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></g>
<text class="d-title" x="72" y="475" text-anchor="start">Navigation confirmed</text>
<text class="d-sub" x="72" y="491" text-anchor="start">the address changes</text>
<rect class="d-shadow" x="32" y="517.5" width="300" height="44" rx="10"/>
<rect class="d-tile" x="32" y="516" width="300" height="44" rx="10"/>
<g class="d-icon" transform="translate(44 529) scale(0.75)"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></g>
<text class="d-title" x="72" y="535" text-anchor="start">afterEach</text>
<text class="d-sub" x="72" y="551" text-anchor="start">title, focus, stops nothing</text>
<rect class="d-shadow" x="32" y="577.5" width="300" height="44" rx="10"/>
<rect class="d-tile" x="32" y="576" width="300" height="44" rx="10"/>
<g class="d-icon" transform="translate(44 589) scale(0.75)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M6.5 6.5h.01M9.5 6.5h.01"/></g>
<text class="d-title" x="72" y="595" text-anchor="start">DOM updated</text>
<text class="d-sub" x="72" y="611" text-anchor="start">the new page appears</text>
</svg>
