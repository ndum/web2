<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 264" role="img" aria-labelledby="p5c1-deps-en-title p5c1-deps-en-desc">
<title id="p5c1-deps-en-title">Tracking and triggering dependencies</title>
<desc id="p5c1-deps-en-desc">Four cards in a row, the ref favorites, the computed value favoriteCount, the render function of AppHeader and the page with the text 3 favorites. Arrows above the row show who reads whom. The render function reads favoriteCount, favoriteCount reads favorites, and Vue remembers each of these dependencies. Arrows below the row show what the change favorites.value.push(3) triggers. Vue marks favoriteCount as stale, runs the render function again, and the page shows the new value.</desc>
<defs><marker id="p5c1-deps-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p5c1-deps-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p5c1-deps-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="264" rx="14"/>
<text class="d-label" x="16" y="34" text-anchor="start">READING, VUE REMEMBERS IT (TRACK)</text>
<path class="d-arrow" d="M 396 100 L 396 72 L 284 72 L 284 96" marker-end="url(#p5c1-deps-en-head)"/>
<text class="d-sub" x="340" y="65" text-anchor="middle">reads</text>
<path class="d-arrow" d="M 228 100 L 228 72 L 116 72 L 116 96" marker-end="url(#p5c1-deps-en-head)"/>
<text class="d-sub" x="172" y="65" text-anchor="middle">reads</text>
<path class="d-arrow d-arrow-accent" d="M 116 153.5 L 116 188 L 228 188 L 228 157.5" marker-end="url(#p5c1-deps-en-head-accent)"/>
<text class="d-sub" x="172" y="180" text-anchor="middle">stale</text>
<path class="d-arrow d-arrow-accent" d="M 284 153.5 L 284 188 L 396 188 L 396 157.5" marker-end="url(#p5c1-deps-en-head-accent)"/>
<text class="d-sub" x="340" y="180" text-anchor="middle">runs again</text>
<path class="d-arrow d-arrow-accent" d="M 452 153.5 L 452 188 L 564 188 L 564 157.5" marker-end="url(#p5c1-deps-en-head-accent)"/>
<text class="d-sub" x="508" y="180" text-anchor="middle">new value</text>
<path class="d-arrow d-arrow-accent" d="M 60 200 L 60 157.5" marker-end="url(#p5c1-deps-en-head-accent)"/>
<text class="d-code" x="16" y="214" text-anchor="start">favorites.value.push(3)</text>
<text class="d-label d-label-blue" x="16" y="246" text-anchor="start">CHANGING, VUE TRIGGERS AGAIN (TRIGGER)</text>
<rect class="d-shadow" x="16" y="101.5" width="144" height="52" rx="10"/>
<rect class="d-tile" x="16" y="100" width="144" height="52" rx="10"/>
<g class="d-icon" transform="translate(28 117) scale(0.75)"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.5"/><path d="M4.5 5.5v13c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-13"/><path d="M4.5 12c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5"/></g>
<text class="d-title" x="56" y="123" text-anchor="start">favorites</text>
<text class="d-code" x="56" y="139" text-anchor="start">ref</text>
<rect class="d-shadow" x="184" y="101.5" width="144" height="52" rx="10"/>
<rect class="d-tile" x="184" y="100" width="144" height="52" rx="10"/>
<g class="d-icon" transform="translate(196 117) scale(0.75)"><path d="M17.5 5.5V4h-11l6 8-6 8h11v-1.5"/></g>
<text class="d-title" x="224" y="123" text-anchor="start">favoriteCount</text>
<text class="d-code" x="224" y="139" text-anchor="start">computed</text>
<rect class="d-shadow" x="352" y="101.5" width="144" height="52" rx="10"/>
<rect class="d-tile" x="352" y="100" width="144" height="52" rx="10"/>
<g class="d-icon" transform="translate(364 117) scale(0.75)"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 6l-3 12"/></g>
<text class="d-title" x="392" y="123" text-anchor="start">render()</text>
<text class="d-code" x="392" y="139" text-anchor="start">AppHeader</text>
<rect class="d-shadow" x="520" y="101.5" width="144" height="52" rx="10"/>
