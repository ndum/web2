<text class="d-code" x="504" y="121" text-anchor="start">name="Raclette oven"</text>
<text class="d-code" x="504" y="137" text-anchor="start">category="Kitchen"</text>
<rect class="d-shadow" x="220" y="17.5" width="240" height="52" rx="10"/>
<rect class="d-tile" x="220" y="16" width="240" height="52" rx="10"/>
<g class="d-icon" transform="translate(232 33) scale(0.75)"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.5"/><path d="M4.5 5.5v13c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-13"/><path d="M4.5 12c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5"/></g>
