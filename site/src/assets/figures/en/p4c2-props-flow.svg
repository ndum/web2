<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" role="img" aria-labelledby="p4c2-flow-en-title p4c2-flow-en-desc">
<title id="p4c2-flow-en-title">Props flow from the parent to the child component</title>
<desc id="p4c2-flow-en-desc">At the top is the component App with the catalog. Three arrows lead down to three cards of the component ItemCard. Each arrow carries the props App passes, for example name equals Drill and category equals Tools. Each card shows only what it received. There is no arrow back up, the data flow only downward.</desc>
<defs><marker id="p4c2-flow-en-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fig-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<rect class="fig-box fig-box-strong" x="250" y="20" width="180" height="64" rx="10"/>
<text class="fig-text" x="340" y="48" text-anchor="middle">App.vue</text>
<text class="fig-sub" x="340" y="70" text-anchor="middle">owns the data</text>
<path class="fig-arrow" d="M 340 84 C 340 144, 115 134, 115 204" marker-end="url(#p4c2-flow-en-head)"/>
<rect class="fig-label-bg" x="51.6" y="158" width="126.8" height="36" rx="4"/>
<text class="fig-code" x="115" y="172" text-anchor="middle">name="Drill"</text>
<text class="fig-code" x="115" y="188" text-anchor="middle">category="Tools"</text>
<rect class="fig-box" x="20" y="210" width="190" height="86" rx="10"/>
<text class="fig-sub" x="32" y="230">ItemCard.vue</text>
<text class="fig-text" x="32" y="258">Drill</text>
<text class="fig-sub" x="32" y="280">Tools</text>
<path class="fig-arrow" d="M 340 84 C 340 144, 340 134, 340 204" marker-end="url(#p4c2-flow-en-head)"/>
<rect class="fig-label-bg" x="262" y="158" width="156" height="36" rx="4"/>
<text class="fig-code" x="340" y="172" text-anchor="middle">name="Tent for four"</text>
<text class="fig-code" x="340" y="188" text-anchor="middle">category="Camping"</text>
<rect class="fig-box" x="245" y="210" width="190" height="86" rx="10"/>
<text class="fig-sub" x="257" y="230">ItemCard.vue</text>
<text class="fig-text" x="257" y="258">Tent for four</text>
<text class="fig-sub" x="257" y="280">Camping</text>
<path class="fig-arrow" d="M 340 84 C 340 144, 565 134, 565 204" marker-end="url(#p4c2-flow-en-head)"/>
<rect class="fig-label-bg" x="487" y="158" width="156" height="36" rx="4"/>
<text class="fig-code" x="565" y="172" text-anchor="middle">name="Raclette oven"</text>
<text class="fig-code" x="565" y="188" text-anchor="middle">category="Kitchen"</text>
<rect class="fig-box" x="470" y="210" width="190" height="86" rx="10"/>
<text class="fig-sub" x="482" y="230">ItemCard.vue</text>
<text class="fig-text" x="482" y="258">Raclette oven</text>
<text class="fig-sub" x="482" y="280">Kitchen</text>
<text class="fig-sub fig-note" x="660" y="58" text-anchor="end">props, downward only</text>
</svg>
