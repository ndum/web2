<text class="d-title d-title-violet" x="420" y="187" text-anchor="start">11/11/2026, 7:00 PM</text>
<text class="d-code" x="420" y="203" text-anchor="start">'America/New_York'</text>
<rect class="d-strip" x="16" y="244" width="648" height="30" rx="8"/>
<text class="d-sub" x="340" y="263" text-anchor="middle">Format a date without a time with timeZone: 'UTC', and it shows November 12 everywhere.</text>
</svg>
