<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="p4c3-events-en-title p4c3-events-en-desc">
<title id="p4c3-events-en-title">Props down, events up</title>
<desc id="p4c3-events-en-desc">App is at the top. Below it on the left is ItemCard, App gives it the name and the availability through props, and the card reports the id back with the event reserve. Below it on the right is SearchBar, App gives it the value modelValue, and the search field reports changes with the event update:modelValue. v-model connects both.</desc>
