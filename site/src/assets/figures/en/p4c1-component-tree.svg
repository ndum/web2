<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 542" role="img" aria-labelledby="p4c1-tree-en-title p4c1-tree-en-desc">
<title id="p4c1-tree-en-title">The tree of components drawn from a wireframe</title>
<desc id="p4c1-tree-en-desc">On the left a wireframe of the catalog page. The header is AppHeader, the search field SearchBar, the category select CategoryFilter, the list ItemList with an ItemCard for every thing and the footer AppFooter. On the right the tree of the whole app. App contains AppHeader, CatalogView, ItemView and AppFooter. CatalogView contains SearchBar, CategoryFilter and ItemList with ItemCard, ItemView contains ReservationForm and BaseDialog, AppFooter contains OpeningHours. App owns catalog, favorites, search text and category, ReservationForm the request.</desc>
