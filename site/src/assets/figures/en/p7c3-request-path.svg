<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 422" role="img" aria-labelledby="p7c3-path-en-title p7c3-path-en-desc">
<title id="p7c3-path-en-title">The path of a request</title>
<desc id="p7c3-path-en-desc">Three areas from top to bottom show the browser with the page from localhost:5173, Vite on port 5173 and the course API on port 3000. In the browser, a component calls an action of the store, and the store sends fetch to /api/en/items. The proxy of Vite takes the request and forwards everything below /api to the course API. The API answers GET /en/items with the catalog and keeps returns and requests in storage/state.json. The answer takes the same way back. On the right, a dashed arrow leads from the store past Vite directly to localhost:3000. That path goes to another origin and therefore needs CORS.</desc>
<defs><marker id="p7c3-path-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p7c3-path-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p7c3-path-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="422" rx="14"/>
<rect class="d-band d-band-2" x="16" y="16" width="648" height="104" rx="12"/>
<text class="d-label d-label-blue" x="32" y="40" text-anchor="start">IN THE BROWSER</text>
<text class="d-meta" x="154.12959999999998" y="40" text-anchor="start">page from localhost:5173</text>
<rect class="d-band d-band-1" x="16" y="136" width="452" height="104" rx="12"/>
<text class="d-label" x="32" y="160" text-anchor="start">VITE ON PORT 5173</text>
<rect class="d-band d-band-3" x="16" y="256" width="648" height="104" rx="12"/>
<text class="d-label d-label-violet" x="32" y="280" text-anchor="start">COURSE API ON PORT 3000</text>
<path class="d-arrow" d="M 212 80 L 248 80" marker-end="url(#p7c3-path-en-head)"/>
<path class="d-arrow" d="M 352 105.5 L 352 172" marker-end="url(#p7c3-path-en-head)"/>
<path class="d-arrow" d="M 352 225.5 L 352 292" marker-end="url(#p7c3-path-en-head)"/>
<path class="d-arrow" d="M 252 320 L 216 320" marker-end="url(#p7c3-path-en-head)"/>
<path class="d-arrow d-dashed" d="M 452 80 L 492 80 L 492 320 L 456 320" marker-end="url(#p7c3-path-en-head)"/>
<text class="d-sub" x="502" y="196" text-anchor="start">directly to localhost:3000</text>
<text class="d-sub" x="502" y="212" text-anchor="start">only with CORS</text>
<rect class="d-shadow" x="32" y="57.5" width="180" height="48" rx="10"/>
<rect class="d-tile" x="32" y="56" width="180" height="48" rx="10"/>
<g class="d-icon" transform="translate(44 71) scale(0.75)"><rect x="3.5" y="7" width="17" height="13" rx="2"/><path d="M8 7V4h3v3M13 7V4h3v3"/></g>
<text class="d-title" x="72" y="77" text-anchor="start">Component</text>
<text class="d-sub" x="72" y="93" text-anchor="start">calls an action</text>
<rect class="d-shadow" x="252" y="57.5" width="200" height="48" rx="10"/>
<rect class="d-tile" x="252" y="56" width="200" height="48" rx="10"/>
<g class="d-icon" transform="translate(264 71) scale(0.75)"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.5"/><path d="M4.5 5.5v13c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-13"/><path d="M4.5 12c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5"/></g>
<text class="d-title" x="292" y="77" text-anchor="start">Store</text>
<text class="d-code" x="292" y="93" text-anchor="start">fetch('/api/en/items')</text>
<rect class="d-shadow" x="252" y="177.5" width="200" height="48" rx="10"/>
<rect class="d-tile d-tile-accent" x="252" y="176" width="200" height="48" rx="10"/>
<g class="d-icon d-icon-accent" transform="translate(264 191) scale(0.75)"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="13" width="16" height="7" rx="1.5"/><path d="M8 7.5h.01M8 16.5h.01"/></g>
<text class="d-title" x="292" y="197" text-anchor="start">Proxy</text>
<text class="d-sub" x="292" y="213" text-anchor="start">forwards /api</text>
