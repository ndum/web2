<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 360" role="img" aria-labelledby="p7c3-path-en-title p7c3-path-en-desc">
<title id="p7c3-path-en-title">The path of a request</title>
<desc id="p7c3-path-en-desc">A sequence from top to bottom. A component calls an action of the store, and the store sends fetch to /api/de/items. Vite on port 5173 takes the request and forwards everything below /api to the course API on port 3000, which answers GET /de/items and keeps returns and requests in storage/state.json. The answer takes the same way back. On the right, a dashed path leads from the store directly to http://localhost:3000. That path goes to another origin and therefore needs CORS.</desc>
<defs><marker id="p7c3-path-en-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fig-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<rect class="fig-box" x="20" y="16" width="280" height="48" rx="6"/>
<text class="fig-text" x="34" y="36" style="font-size: 14px">Component</text>
<text class="fig-sub" x="34" y="54">calls an action</text>
<path class="fig-arrow" d="M 160 66 L 160 84" marker-end="url(#p7c3-path-en-head)"/>
<rect class="fig-box fig-box-strong" x="20" y="86" width="280" height="48" rx="6"/>
<text class="fig-text" x="34" y="106" style="font-size: 14px">Store</text>
<text class="fig-code" x="34" y="124">fetch('/api/en/items')</text>
<path class="fig-arrow" d="M 160 136 L 160 154" marker-end="url(#p7c3-path-en-head)"/>
<rect class="fig-box" x="20" y="156" width="280" height="48" rx="6"/>
<text class="fig-text" x="34" y="176" style="font-size: 14px">Vite on port 5173</text>
<text class="fig-sub" x="34" y="194">proxy, forwards /api</text>
<path class="fig-arrow" d="M 160 206 L 160 224" marker-end="url(#p7c3-path-en-head)"/>
<rect class="fig-box fig-box-strong" x="20" y="226" width="280" height="48" rx="6"/>
<text class="fig-text" x="34" y="246" style="font-size: 14px">Course API on port 3000</text>
<text class="fig-code" x="34" y="264">GET /en/items</text>
<path class="fig-arrow" d="M 160 276 L 160 294" marker-end="url(#p7c3-path-en-head)"/>
<rect class="fig-box" x="20" y="296" width="280" height="48" rx="6"/>
<text class="fig-text" x="34" y="316" style="font-size: 14px">storage/state.json</text>
<text class="fig-sub" x="34" y="334">returns and requests</text>
<path class="fig-arrow" d="M 302 110 L 360 110 L 360 250 L 306 250" marker-end="url(#p7c3-path-en-head)" stroke-dasharray="6 5"/>
<text class="fig-sub fig-strong" x="372" y="176">directly to localhost:3000</text>
<text class="fig-sub" x="372" y="194">only with CORS</text>
</svg>
