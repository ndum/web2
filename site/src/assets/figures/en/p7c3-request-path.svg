<text class="d-code" x="292" y="333" text-anchor="start">GET /en/items</text>
<rect class="d-shadow" x="32" y="297.5" width="180" height="48" rx="10"/>
<rect class="d-tile" x="32" y="296" width="180" height="48" rx="10"/>
<g class="d-icon" transform="translate(44 311) scale(0.75)"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></g>
<text class="d-title" x="72" y="317" text-anchor="start">storage/state.json</text>
<text class="d-sub" x="72" y="333" text-anchor="start">returns and requests</text>
<rect class="d-strip" x="16" y="376" width="648" height="30" rx="8"/>
<text class="d-sub" x="340" y="395" text-anchor="middle">The answer takes the same way back.</text>
</svg>
