<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 360" role="img" aria-labelledby="p7c3-path-en-title p7c3-path-en-desc">
<title id="p7c3-path-en-title">The path of a request</title>
<desc id="p7c3-path-en-desc">A sequence from top to bottom. A component calls an action of the store, and the store sends fetch to /api/de/items. Vite on port 5173 takes the request and forwards everything below /api to the course API on port 3000, which answers GET /de/items and keeps returns and requests in storage/state.json. The answer takes the same way back. On the right, a dashed path leads from the store directly to http://localhost:3000. That path goes to another origin and therefore needs CORS.</desc>
