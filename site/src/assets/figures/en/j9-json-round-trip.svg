<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 438" role="img" aria-labelledby="j9-json-en-title j9-json-en-desc">
<title id="j9-json-en-title">A reservation through JSON and back</title>
<desc id="j9-json-en-desc">At the top the reservation as an object with the fields itemId 6, member M-117, from as a Date for November 7, 2026, days 4 and note with the value undefined. JSON.stringify turns it into one single string, in which from is text in ISO 8601 format and note is missing. JSON.parse reads the string into a new object. There from is a string and no longer a Date, and the field note does not exist.</desc>
