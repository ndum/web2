<path class="d-arrow" d="M 220 218 L 312 218" marker-end="url(#p1c2-references-en-head)"/>
<rect class="d-shadow" x="32" y="57.5" width="188" height="44" rx="10"/>
<rect class="d-tile" x="32" y="56" width="188" height="44" rx="10"/>
<text class="d-title" x="126" y="82.5" text-anchor="middle">tent</text>
<rect class="d-shadow" x="32" y="113.5" width="188" height="44" rx="10"/>
