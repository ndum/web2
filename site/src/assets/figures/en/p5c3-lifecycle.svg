<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 364" role="img" aria-labelledby="p5c3-lifecycle-en-title p5c3-lifecycle-en-desc">
<title id="p5c3-lifecycle-en-title">The lifecycle of a component</title>
<desc id="p5c3-lifecycle-en-desc">A timeline from top to bottom. First setup runs, then onBeforeMount, then onMounted, from here on the component is in the DOM. Every change of the state is followed by onBeforeUpdate and onUpdated, an arrow leads from onUpdated back to onBeforeUpdate. When the component disappears, onBeforeUnmount and onUnmounted follow. On the right, next to setup it says that the state is created there and there is no DOM yet, next to onMounted that focus, measuring and listeners belong there, next to the two update hooks that they run on every change, and next to onUnmounted that listeners and timers are cleaned up there.</desc>
<defs><marker id="p5c3-lifecycle-en-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fig-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<rect class="fig-box" x="70" y="20" width="170" height="34" rx="6"/>
<text class="fig-code" x="155" y="42" text-anchor="middle" style="font-size: 13px">setup</text>
<path class="fig-arrow" d="M 155 56 L 155 68" marker-end="url(#p5c3-lifecycle-en-head)"/>
<rect class="fig-box" x="70" y="70" width="170" height="34" rx="6"/>
<text class="fig-code" x="155" y="92" text-anchor="middle" style="font-size: 13px">onBeforeMount</text>
<path class="fig-arrow" d="M 155 106 L 155 118" marker-end="url(#p5c3-lifecycle-en-head)"/>
<rect class="fig-box fig-box-strong" x="70" y="120" width="170" height="34" rx="6"/>
<text class="fig-code" x="155" y="142" text-anchor="middle" style="font-size: 13px">onMounted</text>
<path class="fig-arrow" d="M 155 156 L 155 168" marker-end="url(#p5c3-lifecycle-en-head)"/>
<rect class="fig-box" x="70" y="170" width="170" height="34" rx="6" stroke-dasharray="5 4"/>
<text class="fig-code" x="155" y="192" text-anchor="middle" style="font-size: 13px">onBeforeUpdate</text>
<path class="fig-arrow" d="M 155 206 L 155 218" marker-end="url(#p5c3-lifecycle-en-head)"/>
<rect class="fig-box" x="70" y="220" width="170" height="34" rx="6" stroke-dasharray="5 4"/>
<text class="fig-code" x="155" y="242" text-anchor="middle" style="font-size: 13px">onUpdated</text>
<path class="fig-arrow" d="M 155 256 L 155 268" marker-end="url(#p5c3-lifecycle-en-head)"/>
<rect class="fig-box" x="70" y="270" width="170" height="34" rx="6"/>
<text class="fig-code" x="155" y="292" text-anchor="middle" style="font-size: 13px">onBeforeUnmount</text>
<path class="fig-arrow" d="M 155 306 L 155 318" marker-end="url(#p5c3-lifecycle-en-head)"/>
<rect class="fig-box fig-box-strong" x="70" y="320" width="170" height="34" rx="6"/>
<text class="fig-code" x="155" y="342" text-anchor="middle" style="font-size: 13px">onUnmounted</text>
<path class="fig-arrow" d="M 68 237 C 20 237, 20 187, 64 187" marker-end="url(#p5c3-lifecycle-en-head)"/>
<text class="fig-sub" x="264" y="34">create state,</text>
<text class="fig-sub" x="264" y="51">no DOM yet</text>
<text class="fig-sub" x="264" y="134">DOM is there, focus,</text>
<text class="fig-sub" x="264" y="151">measuring, listeners</text>
<text class="fig-sub" x="264" y="209">on every change</text>
<text class="fig-sub" x="264" y="226">of the state</text>
<text class="fig-sub" x="264" y="334">clean up, remove</text>
<text class="fig-sub" x="264" y="351">listeners and timers</text>
</svg>
