<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 326" role="img" aria-labelledby="p1c4-loop-en-title p1c4-loop-en-desc">
<title id="p1c4-loop-en-title">The event loop with task queue and microtask queue</title>
<desc id="p1c4-loop-en-desc">On the left is the call stack with the functions that are running. An arrow leads right to timers and requests, which the browser or Node take over, such as setTimeout and fetch. When a timer has run out, its callback goes into the task queue, and so do clicks. Promises put their continuations from then and await into the microtask queue. Two arrows lead back to the call stack. When the stack is empty, the event loop takes all microtasks first and then one task.</desc>
<defs><marker id="p1c4-loop-en-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fig-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<rect class="fig-box" x="20" y="40" width="200" height="250" rx="10"/>
<text class="fig-text" x="120" y="68" text-anchor="middle">Call stack</text>
<rect class="fig-box fig-box-strong" x="40" y="214" width="160" height="28" rx="6"/>
<text class="fig-code" x="120" y="233" text-anchor="middle">showCatalog()</text>
<rect class="fig-box fig-box-strong" x="40" y="248" width="160" height="28" rx="6"/>
<text class="fig-code" x="120" y="267" text-anchor="middle">main.mjs</text>
<rect class="fig-box" x="450" y="40" width="210" height="72" rx="10"/>
<text class="fig-text" x="555" y="68" text-anchor="middle">Timers and requests</text>
<text class="fig-code" x="555" y="94" text-anchor="middle">setTimeout, fetch</text>
<path class="fig-arrow" d="M 222 76 L 446 76" marker-end="url(#p1c4-loop-en-head)"/>
<rect class="fig-label-bg" x="309.2" y="59" width="49.599999999999994" height="18" rx="3"/>
<text class="fig-sub" x="334" y="72" text-anchor="middle">starts</text>
<path class="fig-arrow" d="M 555 112 L 555 146" marker-end="url(#p1c4-loop-en-head)"/>
<text class="fig-sub" x="566" y="134">done</text>
<rect class="fig-box" x="330" y="150" width="330" height="52" rx="10"/>
<text class="fig-text" x="346" y="182">Task queue</text>
<rect class="fig-box fig-box-strong" x="522" y="160" width="60" height="32" rx="6"/>
<text class="fig-code" x="552" y="181" text-anchor="middle">Timer</text>
<rect class="fig-box fig-box-strong" x="590" y="160" width="60" height="32" rx="6"/>
<text class="fig-code" x="620" y="181" text-anchor="middle">click</text>
<path class="fig-arrow" d="M 328 176 L 224 176" marker-end="url(#p1c4-loop-en-head)"/>
<rect class="fig-label-bg" x="234.7" y="155" width="82.6" height="18" rx="3"/>
<text class="fig-sub" x="276" y="168" text-anchor="middle">2. then one</text>
<rect class="fig-box" x="330" y="232" width="330" height="52" rx="10"/>
<text class="fig-text" x="346" y="264">Microtask queue</text>
<rect class="fig-box fig-box-strong" x="522" y="242" width="60" height="32" rx="6"/>
<text class="fig-code" x="552" y="263" text-anchor="middle">then</text>
<rect class="fig-box fig-box-strong" x="590" y="242" width="60" height="32" rx="6"/>
<text class="fig-code" x="620" y="263" text-anchor="middle">await</text>
<path class="fig-arrow" d="M 328 258 L 224 258" marker-end="url(#p1c4-loop-en-head)"/>
<rect class="fig-label-bg" x="231.4" y="237" width="89.19999999999999" height="18" rx="3"/>
<text class="fig-sub" x="276" y="250" text-anchor="middle">1. all first</text>
<text class="fig-sub fig-note" x="20" y="316">When the stack is empty, the event loop takes all microtasks first, then one task.</text>
</svg>
