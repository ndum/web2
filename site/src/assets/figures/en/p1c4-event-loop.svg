<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 418" role="img" aria-labelledby="p1c4-loop-en-title p1c4-loop-en-desc">
<title id="p1c4-loop-en-title">The event loop with task queue and microtask queue</title>
<desc id="p1c4-loop-en-desc">On the left is the call stack with the functions that are running. At the bottom lies main.mjs, with showCatalog on top of it. An arrow leads right from showCatalog to timers and requests, which the browser or Node takes over, such as setTimeout and fetch. When a timer has run out, its callback goes into the task queue above, and so do clicks. Promises put their continuations from then and await into the microtask queue at the top. Two numbered arrows lead back to the call stack, the first from the microtask queue, the second from the task queue. When the stack is empty, the event loop takes all microtasks first and then one task.</desc>
<defs><marker id="p1c4-loop-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p1c4-loop-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p1c4-loop-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
