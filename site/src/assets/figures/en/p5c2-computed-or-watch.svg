<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 278" role="img" aria-labelledby="p5c2-choice-en-title p5c2-choice-en-desc">
<title id="p5c2-choice-en-title">computed or watch</title>
<desc id="p5c2-choice-en-desc">A decision tree with two questions as cards. If a value is derived from other values, such as the number of hits, then computed. Otherwise, if something should happen outside the component, such as storing, the title of the tab or a request to the server, then watch or watchEffect. If the code only reacts to an action, such as a click, then a function for the event.</desc>
<defs><marker id="p5c2-choice-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p5c2-choice-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p5c2-choice-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="278" rx="14"/>
<path class="d-arrow d-arrow-accent" d="M 376 42 L 452 42" marker-end="url(#p5c2-choice-en-head-accent)"/>
<text class="d-sub" x="416" y="34" text-anchor="middle">yes</text>
<path class="d-arrow" d="M 196 69.5 L 196 108" marker-end="url(#p5c2-choice-en-head)"/>
<text class="d-sub" x="206" y="94" text-anchor="start">no</text>
<rect class="d-shadow" x="16" y="17.5" width="360" height="52" rx="10"/>
<rect class="d-tile" x="16" y="16" width="360" height="52" rx="10"/>
<text class="d-title" x="196" y="46.5" text-anchor="middle">Is a value derived from other values?</text>
<path class="d-arrow" d="M 376 138 L 452 138" marker-end="url(#p5c2-choice-en-head)"/>
<text class="d-sub" x="416" y="130" text-anchor="middle">yes</text>
<path class="d-arrow" d="M 196 165.5 L 196 204" marker-end="url(#p5c2-choice-en-head)"/>
<text class="d-sub" x="206" y="190" text-anchor="start">no</text>
<rect class="d-shadow" x="16" y="113.5" width="360" height="52" rx="10"/>
<rect class="d-tile" x="16" y="112" width="360" height="52" rx="10"/>
<text class="d-title" x="196" y="142.5" text-anchor="middle">Should something happen outside the component?</text>
<rect class="d-shadow" x="456" y="17.5" width="208" height="52" rx="10"/>
<rect class="d-tile d-tile-accent" x="456" y="16" width="208" height="52" rx="10"/>
<g class="d-icon d-icon-accent" transform="translate(468 33) scale(0.75)"><path d="M17.5 5.5V4h-11l6 8-6 8h11v-1.5"/></g>
<text class="d-title" x="496" y="39" text-anchor="start">computed</text>
<text class="d-sub" x="496" y="55" text-anchor="start">number of hits</text>
<rect class="d-shadow" x="456" y="113.5" width="208" height="52" rx="10"/>
<rect class="d-tile" x="456" y="112" width="208" height="52" rx="10"/>
<g class="d-icon" transform="translate(468 129) scale(0.75)"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g>
