<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" role="img" aria-labelledby="p2c2-loop-en-title p2c2-loop-en-desc">
<title id="p2c2-loop-en-title">The cycle of the SPA by hand</title>
<desc id="p2c2-loop-en-desc">Four boxes form a cycle. The state is an object with status, items and route. The function render reads the state and writes the page from it. On the page, clicks, input and hashchange fire events. The event handlers change the state, and the cycle starts again. The handlers never change the page directly.</desc>
<defs><marker id="p2c2-loop-en-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fig-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<rect class="fig-box fig-box-strong" x="60" y="40" width="200" height="64" rx="10"/>
<text class="fig-text" x="160" y="68" text-anchor="middle">State</text>
<text class="fig-code" x="160" y="90" text-anchor="middle">{ status, items, route }</text>
<rect class="fig-box" x="420" y="40" width="200" height="64" rx="10"/>
<text class="fig-text" x="520" y="68" text-anchor="middle">render()</text>
<text class="fig-sub" x="520" y="90" text-anchor="middle">builds HTML from the state</text>
<rect class="fig-box" x="420" y="200" width="200" height="64" rx="10"/>
<text class="fig-text" x="520" y="228" text-anchor="middle">Page</text>
<text class="fig-sub" x="520" y="250" text-anchor="middle">the DOM in the browser</text>
<rect class="fig-box" x="60" y="200" width="200" height="64" rx="10"/>
<text class="fig-text" x="160" y="228" text-anchor="middle">Event</text>
<text class="fig-sub" x="160" y="250" text-anchor="middle">click, input, hashchange</text>
<path class="fig-arrow" d="M 262 72 L 416 72" marker-end="url(#p2c2-loop-en-head)"/>
<rect class="fig-label-bg" x="318.5" y="53" width="43" height="18" rx="3"/>
<text class="fig-sub" x="340" y="66" text-anchor="middle">reads</text>
<path class="fig-arrow" d="M 520 106 L 520 196" marker-end="url(#p2c2-loop-en-head)"/>
<rect class="fig-label-bg" x="495.2" y="143" width="49.599999999999994" height="18" rx="3"/>
<text class="fig-sub" x="520" y="156" text-anchor="middle">writes</text>
<path class="fig-arrow" d="M 418 232 L 264 232" marker-end="url(#p2c2-loop-en-head)"/>
<rect class="fig-label-bg" x="318.5" y="213" width="43" height="18" rx="3"/>
<text class="fig-sub" x="340" y="226" text-anchor="middle">fires</text>
<path class="fig-arrow" d="M 160 198 L 160 108" marker-end="url(#p2c2-loop-en-head)"/>
<rect class="fig-label-bg" x="131.9" y="143" width="56.199999999999996" height="18" rx="3"/>
<text class="fig-sub" x="160" y="156" text-anchor="middle">changes</text>
<text class="fig-sub fig-note" x="340" y="296" text-anchor="middle">The handlers change only the state, never the page directly.</text>
</svg>
