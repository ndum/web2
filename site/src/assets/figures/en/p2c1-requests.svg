<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 434" role="img" aria-labelledby="p2c1-requests-en-title p2c1-requests-en-desc">
<title id="p2c1-requests-en-title">Requests of a multi-page website and of an SPA</title>
<desc id="p2c1-requests-en-desc">On the left a multi-page website, on the right a single page application, each in three steps. When the catalog opens, the multi-page website loads a whole page, the SPA an almost empty page, its JavaScript and the data as JSON. On a click on the projector and on going back to the catalog, the multi-page website loads a whole page each time, while the SPA sends no request and its JavaScript shows the thing and the catalog by itself.</desc>
<defs><marker id="p2c1-requests-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p2c1-requests-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p2c1-requests-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="434" rx="14"/>
<rect class="d-band d-band-1" x="16" y="16" width="316" height="402" rx="12"/>
<text class="d-label" x="32" y="40" text-anchor="start">MULTI-PAGE WEBSITE (MPA)</text>
<rect class="d-band d-band-2" x="348" y="16" width="316" height="402" rx="12"/>
<text class="d-label d-label-blue" x="364" y="40" text-anchor="start">SINGLE PAGE APPLICATION (SPA)</text>
<circle class="d-badge" cx="42" cy="64" r="10"/>
<text class="d-badge-text" x="42" y="68" text-anchor="middle">1</text>
<text class="d-title-small" x="60" y="68" text-anchor="start">Open the catalog</text>
<rect class="d-shadow" x="32" y="83.5" width="284" height="44" rx="10"/>
<rect class="d-tile" x="32" y="82" width="284" height="44" rx="10"/>
<g class="d-icon" transform="translate(44 95) scale(0.75)"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></g>
<text class="d-title" x="72" y="101" text-anchor="start">Whole page</text>
<text class="d-code" x="72" y="117" text-anchor="start">GET /catalog</text>
<circle class="d-badge d-badge-accent" cx="374" cy="64" r="10"/>
<text class="d-badge-text d-badge-text-accent" x="374" y="68" text-anchor="middle">1</text>
<text class="d-title-small" x="392" y="68" text-anchor="start">Open the catalog</text>
<rect class="d-shadow" x="364" y="83.5" width="284" height="44" rx="10"/>
<rect class="d-tile" x="364" y="82" width="284" height="44" rx="10"/>
<g class="d-icon" transform="translate(376 95) scale(0.75)"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></g>
<text class="d-title" x="404" y="101" text-anchor="start">Almost empty page</text>
<text class="d-code" x="404" y="117" text-anchor="start">GET /</text>
<rect class="d-shadow" x="364" y="135.5" width="284" height="44" rx="10"/>
<rect class="d-tile" x="364" y="134" width="284" height="44" rx="10"/>
<g class="d-icon" transform="translate(376 147) scale(0.75)"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 6l-3 12"/></g>
<text class="d-title" x="404" y="153" text-anchor="start">JavaScript</text>
<text class="d-code" x="404" y="169" text-anchor="start">GET /main.js</text>
<rect class="d-shadow" x="364" y="187.5" width="284" height="44" rx="10"/>
<rect class="d-tile" x="364" y="186" width="284" height="44" rx="10"/>
<g class="d-icon" transform="translate(376 199) scale(0.75)"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></g>
<text class="d-title" x="404" y="205" text-anchor="start">Data as JSON</text>
<text class="d-code" x="404" y="221" text-anchor="start">GET /items</text>
<circle class="d-badge" cx="42" cy="254" r="10"/>
<text class="d-badge-text" x="42" y="258" text-anchor="middle">2</text>
<text class="d-title-small" x="60" y="258" text-anchor="start">Click the projector</text>
<rect class="d-shadow" x="32" y="273.5" width="284" height="44" rx="10"/>
<rect class="d-tile" x="32" y="272" width="284" height="44" rx="10"/>
<g class="d-icon" transform="translate(44 285) scale(0.75)"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></g>
<text class="d-title" x="72" y="291" text-anchor="start">Whole page</text>
<text class="d-code" x="72" y="307" text-anchor="start">GET /things/6</text>
<circle class="d-badge" cx="374" cy="254" r="10"/>
<text class="d-badge-text" x="374" y="258" text-anchor="middle">2</text>
<text class="d-title-small" x="392" y="258" text-anchor="start">Click the projector</text>
<rect class="d-placeholder" x="364" y="272" width="284" height="44" rx="10"/>
<text class="d-sub" x="506" y="298" text-anchor="middle">no request, JavaScript shows the thing</text>
<circle class="d-badge" cx="42" cy="340" r="10"/>
<text class="d-badge-text" x="42" y="344" text-anchor="middle">3</text>
<text class="d-title-small" x="60" y="344" text-anchor="start">Back to the catalog</text>
<rect class="d-shadow" x="32" y="359.5" width="284" height="44" rx="10"/>
<rect class="d-tile" x="32" y="358" width="284" height="44" rx="10"/>
<g class="d-icon" transform="translate(44 371) scale(0.75)"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></g>
<text class="d-title" x="72" y="377" text-anchor="start">Whole page</text>
<text class="d-code" x="72" y="393" text-anchor="start">GET /catalog</text>
<circle class="d-badge" cx="374" cy="340" r="10"/>
<text class="d-badge-text" x="374" y="344" text-anchor="middle">3</text>
<text class="d-title-small" x="392" y="344" text-anchor="start">Back to the catalog</text>
<rect class="d-placeholder" x="364" y="358" width="284" height="44" rx="10"/>
<text class="d-sub" x="506" y="384" text-anchor="middle">no request, JavaScript shows the catalog</text>
</svg>
