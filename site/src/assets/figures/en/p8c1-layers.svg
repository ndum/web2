<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" role="img" aria-labelledby="p8c1-layers-en-title p8c1-layers-en-desc">
<title id="p8c1-layers-en-title">The layers of the app</title>
<desc id="p8c1-layers-en-desc">Four levels from top to bottom, the arrows show who imports whom. At the top, main.js, App.vue and the router put the app together and import the features. The features hold pages, their own components and stores, and they import shared building blocks and the layer for the API. Shared building blocks in components, composables and utils know no feature. Only the layer for the API in src/api talks to the server with fetch. No arrow points upwards.</desc>
<defs><marker id="p8c1-layers-en-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fig-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<rect class="fig-box" x="175" y="20" width="250" height="50" rx="6"/>
<text class="fig-text" x="189" y="41" style="font-size: 14px">App and router</text>
<text class="fig-sub" x="189" y="59">main.js, App.vue, router</text>
<rect class="fig-box fig-box-strong" x="175" y="120" width="250" height="50" rx="6"/>
<text class="fig-text" x="189" y="141" style="font-size: 14px">Features</text>
<text class="fig-sub" x="189" y="159">pages, own components, stores</text>
<rect class="fig-box" x="40" y="220" width="250" height="50" rx="6"/>
<text class="fig-text" x="54" y="241" style="font-size: 14px">Shared building blocks</text>
<text class="fig-sub" x="54" y="259">components, composables, utils</text>
<rect class="fig-box fig-box-strong" x="310" y="220" width="250" height="50" rx="6"/>
<text class="fig-text" x="324" y="241" style="font-size: 14px">Layer for the API</text>
<text class="fig-sub" x="324" y="259">src/api</text>
<rect class="fig-box" x="310" y="320" width="250" height="50" rx="6"/>
<text class="fig-text" x="324" y="341" style="font-size: 14px">Server</text>
<text class="fig-sub" x="324" y="359">course API or stand-in</text>
<path class="fig-arrow" d="M 300 72 L 300 116" marker-end="url(#p8c1-layers-en-head)"/>
<text class="fig-sub" x="310" y="100">imports</text>
<path class="fig-arrow" d="M 260 172 L 165 216" marker-end="url(#p8c1-layers-en-head)"/>
<path class="fig-arrow" d="M 340 172 L 435 216" marker-end="url(#p8c1-layers-en-head)"/>
<text class="fig-sub" x="300" y="200" text-anchor="middle">imports</text>
<path class="fig-arrow" d="M 435 272 L 435 316" marker-end="url(#p8c1-layers-en-head)" stroke-dasharray="6 5"/>
<text class="fig-code" x="445" y="300">fetch</text>
<text class="fig-sub fig-strong" x="40" y="350">No arrow points upwards.</text>
</svg>
