<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" role="img" aria-labelledby="p8c1-layers-en-title p8c1-layers-en-desc">
<title id="p8c1-layers-en-title">The layers of the app</title>
<desc id="p8c1-layers-en-desc">Four levels from top to bottom, the arrows show who imports whom. At the top, main.js, App.vue and the router put the app together and import the features. The features hold pages, their own components and stores, and they import shared building blocks and the layer for the API. Shared building blocks in components, composables and utils know no feature. Only the layer for the API in src/api talks to the server with fetch. No arrow points upwards.</desc>
