<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 338" role="img" aria-labelledby="j4-object-en-title j4-object-en-desc">
<title id="j4-object-en-title">A thing as an object in the array</title>
<desc id="j4-object-en-desc">On the left an object for the raclette oven with the keys id, name, deposit and availableFrom and their values 3, Raclette oven, 30 and null. An arrow leads into an array with the nine things of the catalog. There the object stands in third place, at items[2], after the drill at items[0] and the tent for four at items[1]. The other six things stand at items[3] to items[8].</desc>
<defs><marker id="j4-object-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="j4-object-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="j4-object-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="338" rx="14"/>
<rect class="d-band d-band-1" x="16" y="16" width="248" height="260" rx="12"/>
<text class="d-label" x="32" y="40" text-anchor="start">OBJECT</text>
<text class="d-meta" x="96.8528" y="40" text-anchor="start">one thing</text>
<rect class="d-band d-band-2" x="312" y="16" width="352" height="260" rx="12"/>
<text class="d-label d-label-blue" x="328" y="40" text-anchor="start">ARRAY</text>
<text class="d-meta" x="384.044" y="40" text-anchor="start">the catalog with nine things</text>
