<g class="d-icon" transform="translate(340 69) scale(0.75)"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></g>
<text class="d-title" x="368" y="75" text-anchor="start">Drill</text>
<text class="d-code" x="368" y="91" text-anchor="start">items[0]</text>
<rect class="d-shadow" x="328" y="109.5" width="320" height="44" rx="10"/>
<rect class="d-tile" x="328" y="108" width="320" height="44" rx="10"/>
<g class="d-icon" transform="translate(340 121) scale(0.75)"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></g>
<text class="d-title" x="368" y="127" text-anchor="start">Tent for four</text>
<text class="d-code" x="368" y="143" text-anchor="start">items[1]</text>
