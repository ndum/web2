<rect class="d-tile d-tile-accent" x="32" y="114" width="216" height="136" rx="10"/>
<text class="d-code" x="48" y="148" text-anchor="start">id: 3</text>
<text class="d-code" x="48" y="176" text-anchor="start">name: 'Raclette oven'</text>
<text class="d-code" x="48" y="204" text-anchor="start">deposit: 30</text>
<text class="d-code" x="48" y="232" text-anchor="start">availableFrom: null</text>
<rect class="d-shadow" x="328" y="57.5" width="320" height="44" rx="10"/>
