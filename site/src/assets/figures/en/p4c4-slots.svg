<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" role="img" aria-labelledby="p4c4-slots-en-title p4c4-slots-en-desc">
<title id="p4c4-slots-en-title">Content fills the slots of a component</title>
<desc id="p4c4-slots-en-desc">On the left the template of the parent component with BaseDialog. It fills the slot title with the title, the default slot with the text of the request and the slot actions with a button. On the right the template of BaseDialog with the three places slot name title, slot and slot name actions. Arrows connect each piece of content with its slot.</desc>
<defs><marker id="p4c4-slots-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p4c4-slots-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p4c4-slots-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="348" rx="14"/>
<rect class="d-band d-band-1" x="16" y="16" width="300" height="316" rx="12"/>
<text class="d-label" x="32" y="40" text-anchor="start">PARENT COMPONENT</text>
<text class="d-code" x="300" y="40" text-anchor="end">App.vue</text>
<text class="d-code" x="32" y="71" text-anchor="start">&lt;BaseDialog&gt;</text>
<text class="d-code" x="48" y="93" text-anchor="start">&lt;template #title&gt;</text>
<rect class="d-shadow" x="64" y="105.5" width="236" height="36" rx="10"/>
<rect class="d-tile" x="64" y="104" width="236" height="36" rx="10"/>
<text class="d-code" x="182" y="126" text-anchor="middle">Check the request</text>
<text class="d-code" x="48" y="159" text-anchor="start">&lt;/template&gt;</text>
<rect class="d-shadow" x="48" y="171.5" width="252" height="36" rx="10"/>
<rect class="d-tile" x="48" y="170" width="252" height="36" rx="10"/>
<text class="d-code" x="174" y="192" text-anchor="middle">Drill, Nov 18 to 21</text>
<text class="d-code" x="48" y="225" text-anchor="start">&lt;template #actions&gt;</text>
<rect class="d-shadow" x="64" y="237.5" width="236" height="36" rx="10"/>
<rect class="d-tile" x="64" y="236" width="236" height="36" rx="10"/>
<text class="d-code" x="182" y="258" text-anchor="middle">&lt;button&gt;Confirm&lt;/button&gt;</text>
<text class="d-code" x="48" y="291" text-anchor="start">&lt;/template&gt;</text>
<text class="d-code" x="32" y="313" text-anchor="start">&lt;/BaseDialog&gt;</text>
<rect class="d-band d-band-2" x="364" y="16" width="300" height="316" rx="12"/>
<text class="d-label d-label-blue" x="380" y="40" text-anchor="start">CHILD COMPONENT</text>
<text class="d-code" x="648" y="40" text-anchor="end">BaseDialog.vue</text>
<text class="d-code" x="380" y="71" text-anchor="start">&lt;div role="dialog"&gt;</text>
<text class="d-code" x="396" y="93" text-anchor="start">&lt;h2&gt;</text>
<rect class="d-placeholder" x="412" y="104" width="236" height="36" rx="10"/>
<text class="d-code" x="530" y="126" text-anchor="middle">&lt;slot name="title" /&gt;</text>
<text class="d-code" x="396" y="159" text-anchor="start">&lt;/h2&gt;</text>
<rect class="d-placeholder" x="396" y="170" width="252" height="36" rx="10"/>
<text class="d-code" x="522" y="192" text-anchor="middle">&lt;slot /&gt;</text>
<text class="d-code" x="396" y="225" text-anchor="start">&lt;div class="actions"&gt;</text>
<rect class="d-placeholder" x="412" y="236" width="236" height="36" rx="10"/>
<text class="d-code" x="530" y="258" text-anchor="middle">&lt;slot name="actions" /&gt;</text>
<text class="d-code" x="396" y="291" text-anchor="start">&lt;/div&gt;</text>
<text class="d-code" x="380" y="313" text-anchor="start">&lt;/div&gt;</text>
<path class="d-arrow d-arrow-accent" d="M 300 122 L 408 122" marker-end="url(#p4c4-slots-en-head-accent)"/>
<path class="d-arrow d-arrow-accent" d="M 300 188 L 392 188" marker-end="url(#p4c4-slots-en-head-accent)"/>
