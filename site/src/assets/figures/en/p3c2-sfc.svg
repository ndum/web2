<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 402" role="img" aria-labelledby="p3c2-sfc-en-title p3c2-sfc-en-desc">
<title id="p3c2-sfc-en-title">How a single file component gets onto the page</title>
<desc id="p3c2-sfc-en-desc">At the top the file App.vue with three blocks side by side, template for the structure, script setup for state and logic and style scoped for the looks. Below, Vite translates the file with the plugin for Vue into a JavaScript module with a render function and into CSS. main.js imports the module, creates the app with createApp and mounts it with mount into the element with the id app in index.html.</desc>
