<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" role="img" aria-labelledby="p8c1-folders-en-title p8c1-folders-en-desc">
<title id="p8c1-folders-en-title">Folders by kind and by feature</title>
<desc id="p8c1-folders-en-desc">Two folder trees side by side. On the left the app is sorted by the kind of file, in views, components, stores and composables, and the four files of the requests sit in four different folders. On the right every feature has a folder below features, catalog and reservations with their pages, components, stores and routes. The files of the requests sit together there. Shared building blocks live in components, the layer for the API in api.</desc>
