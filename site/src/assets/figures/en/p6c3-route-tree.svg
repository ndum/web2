<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 438" role="img" aria-labelledby="p6c3-tree-en-title p6c3-tree-en-desc">
<title id="p6c3-tree-en-title">The routes of the case app</title>
<desc id="p6c3-tree-en-desc">A tree with App and its RouterView at the top. Below it hang the routes / with CatalogView, /items/:id with ItemView, /favorites with FavoritesView, /association with AssociationView, /login with LoginView, the catch-all route with NotFoundView and /team with TeamLayout. TeamLayout has a RouterView of its own with the child routes for loans and returns. The card of /team carries the tag team only, the three cards of the team are dashed because they load on demand, and next to the catch-all route it says that it catches every other address.</desc>
<defs><marker id="p6c3-tree-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p6c3-tree-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p6c3-tree-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
