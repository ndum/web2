<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 486" role="img" aria-labelledby="p6c3-tree-en-title p6c3-tree-en-desc">
<title id="p6c3-tree-en-title">The routes of the case app</title>
<desc id="p6c3-tree-en-desc">A tree with App and its RouterView at the top. Below it the routes / with CatalogView, /items/:id with ItemView, /favorites with FavoritesView, /association with AssociationView, /login with LoginView, /team with TeamLayout and the catch-all route with NotFoundView. TeamLayout has a RouterView of its own with the child routes for loans and returns. Next to /team it says that the area is for the team only and is loaded on demand, next to the catch-all route that it catches every other address.</desc>
