<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 288" role="img" aria-labelledby="p7c4-lifetime-en-title p7c4-lifetime-en-desc">
<title id="p7c4-lifetime-en-title">How long data stays in the browser</title>
<desc id="p7c4-lifetime-en-desc">Four bars above a timeline with six numbered events, load page, reload, second tab, close tab, close browser and open browser. A store in memory lasts until the reload. sessionStorage survives the reload, belongs to this tab only and ends when it closes. A cookie without expiry applies to all tabs and ends when the browser closes. localStorage applies to all tabs and is still there after the next start.</desc>
<defs><marker id="p7c4-lifetime-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p7c4-lifetime-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p7c4-lifetime-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="288" rx="14"/>
<path class="d-grid" d="M 252 43 V 215"/>
<path class="d-grid" d="M 396 91 V 215"/>
<path class="d-grid" d="M 468 139 V 215"/>
<path class="d-axis" d="M 180 228 H 584"/>
<text class="d-title-small" x="16" y="32" text-anchor="start">Store</text>
<text class="d-sub" x="16" y="47" text-anchor="start">in memory</text>
<rect class="d-fill-blue" x="180" y="27" width="72" height="16" rx="4"/>
<text class="d-sub" x="260" y="39" text-anchor="start">until the reload</text>
<text class="d-title-small" x="16" y="80" text-anchor="start">sessionStorage</text>
<text class="d-sub" x="16" y="95" text-anchor="start">this tab only</text>
<rect class="d-fill-blue" x="180" y="75" width="216" height="16" rx="4"/>
<text class="d-sub" x="404" y="87" text-anchor="start">until the tab closes</text>
<text class="d-title-small" x="16" y="128" text-anchor="start">Cookie</text>
<text class="d-sub" x="16" y="143" text-anchor="start">without expiry, all tabs</text>
<rect class="d-fill-blue" x="180" y="123" width="288" height="16" rx="4"/>
<text class="d-sub" x="476" y="135" text-anchor="start">until the browser closes</text>
<text class="d-title-small" x="16" y="176" text-anchor="start">localStorage</text>
<text class="d-sub" x="16" y="191" text-anchor="start">all tabs</text>
<path class="d-fill-blue" d="M 184 171 H 574 L 584 179 L 574 187 H 184 A 4 4 0 0 1 180 183 V 175 A 4 4 0 0 1 184 171 Z"/>
<text class="d-sub" x="592" y="183" text-anchor="start">stays</text>
<circle class="d-badge" cx="180" cy="228" r="10"/>
<text class="d-badge-text" x="180" y="232" text-anchor="middle">1</text>
<text class="d-sub" x="180" y="254" text-anchor="middle">load</text>
<text class="d-sub" x="180" y="268" text-anchor="middle">page</text>
<circle class="d-badge" cx="252" cy="228" r="10"/>
<text class="d-badge-text" x="252" y="232" text-anchor="middle">2</text>
<text class="d-sub" x="252" y="254" text-anchor="middle">reload</text>
<circle class="d-badge" cx="324" cy="228" r="10"/>
<text class="d-badge-text" x="324" y="232" text-anchor="middle">3</text>
<text class="d-sub" x="324" y="254" text-anchor="middle">second</text>
<text class="d-sub" x="324" y="268" text-anchor="middle">tab</text>
<circle class="d-badge" cx="396" cy="228" r="10"/>
<text class="d-badge-text" x="396" y="232" text-anchor="middle">4</text>
<text class="d-sub" x="396" y="254" text-anchor="middle">close</text>
<text class="d-sub" x="396" y="268" text-anchor="middle">tab</text>
<circle class="d-badge" cx="468" cy="228" r="10"/>
<text class="d-badge-text" x="468" y="232" text-anchor="middle">5</text>
<text class="d-sub" x="468" y="254" text-anchor="middle">close</text>
<text class="d-sub" x="468" y="268" text-anchor="middle">browser</text>
<circle class="d-badge" cx="540" cy="228" r="10"/>
<text class="d-badge-text" x="540" y="232" text-anchor="middle">6</text>
<text class="d-sub" x="540" y="254" text-anchor="middle">open</text>
<text class="d-sub" x="540" y="268" text-anchor="middle">browser</text>
</svg>
