<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 294" role="img" aria-labelledby="p7c4-lifetime-en-title p7c4-lifetime-en-desc">
<title id="p7c4-lifetime-en-title">How long data stays in the browser</title>
<desc id="p7c4-lifetime-en-desc">Four bars across six events: load page, reload, second tab, close tab, close browser and open browser. A store in memory lasts until the reload. sessionStorage survives the reload, belongs to this tab only and ends when it closes. A cookie without expiry applies to all tabs and ends when the browser closes. localStorage applies to all tabs and is still there after the next start.</desc>
