<rect class="d-tile" x="452" y="330" width="140" height="34" rx="10"/>
<text class="d-title" x="522" y="351.5" text-anchor="middle">in</text>
<rect class="d-placeholder" x="260" y="330" width="96" height="34" rx="10"/>
<text class="d-sub" x="308" y="351" text-anchor="middle">5 spaces</text>
<rect class="d-strip" x="16" y="396" width="648" height="30" rx="8"/>
<text class="d-sub" x="340" y="415" text-anchor="middle">padEnd fills every name with spaces up to 14 characters, so CHF starts at the same place in every line.</text>
