<rect class="d-band d-band-1" x="16" y="16" width="648" height="174" rx="12"/>
<text class="d-label" x="32" y="40" text-anchor="start">WITHOUT PADDING</text>
<text class="d-meta" x="164.9384" y="40" text-anchor="start">every name as long as it is</text>
