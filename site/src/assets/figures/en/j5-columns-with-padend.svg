<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 442" role="img" aria-labelledby="j5-columns-en-title j5-columns-en-desc">
<title id="j5-columns-en-title">Columns with padEnd</title>
<desc id="j5-columns-en-desc">At the top three lines of the counter helper without padding, for the drill, the beer bench set and the projector, each with number, name, deposit and whether the thing is in. The names differ in length, so the amount starts at a different place in every line. At the bottom the same lines with padEnd. It adds 9 spaces to the drill and 5 to the projector, until every name has 14 characters like the beer bench set. Now CHF 20, CHF 40 and CHF 80 line up exactly.</desc>
