<rect class="d-tile" x="76" y="56" width="100" height="34" rx="10"/>
<text class="d-title" x="126" y="77.5" text-anchor="middle">Drill</text>
<rect class="d-shadow" x="184" y="57.5" width="80" height="34" rx="10"/>
<rect class="d-tile" x="184" y="56" width="80" height="34" rx="10"/>
<text class="d-title" x="224" y="77.5" text-anchor="middle">CHF 20</text>
<rect class="d-shadow" x="272" y="57.5" width="140" height="34" rx="10"/>
<rect class="d-tile" x="272" y="56" width="140" height="34" rx="10"/>
