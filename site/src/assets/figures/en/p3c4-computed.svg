<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 382" role="img" aria-labelledby="p3c4-computed-en-title p3c4-computed-en-desc">
<title id="p3c4-computed-en-title">Dependencies of the computed values in the catalog</title>
<desc id="p3c4-computed-en-desc">On the left are the data items and the refs query and onlyAvailable. The computed value visibleItems reads all three, availableCount reads only items. The template shows the list from visibleItems and the number from availableCount. When query changes, Vue recalculates only visibleItems and updates the list.</desc>
<defs><marker id="p3c4-computed-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p3c4-computed-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p3c4-computed-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
<rect class="d-ground" x="0" y="0" width="680" height="382" rx="14"/>
<rect class="d-band d-band-1" x="16" y="16" width="192" height="296" rx="12"/>
<text class="d-label" x="32" y="40" text-anchor="start">DATA AND REFS</text>
<rect class="d-band d-band-2" x="224" y="16" width="176" height="296" rx="12"/>
<text class="d-label d-label-blue" x="240" y="40" text-anchor="start">COMPUTED VALUES</text>
<rect class="d-band d-band-1" x="416" y="16" width="248" height="296" rx="12"/>
<text class="d-label" x="432" y="40" text-anchor="start">TEMPLATE</text>
<path class="d-arrow d-arrow-accent" d="M 192 80 L 236 80" marker-end="url(#p3c4-computed-en-head-accent)"/>
<path class="d-arrow" d="M 192 140 L 236 140" marker-end="url(#p3c4-computed-en-head)"/>
<path class="d-arrow" d="M 192 200 L 236 200" marker-end="url(#p3c4-computed-en-head)"/>
<path class="d-arrow" d="M 112 225.5 L 112 272 L 236 272" marker-end="url(#p3c4-computed-en-head)"/>
<path class="d-arrow d-arrow-accent" d="M 384 140 L 428 140" marker-end="url(#p3c4-computed-en-head-accent)"/>
<path class="d-arrow" d="M 384 272 L 428 272" marker-end="url(#p3c4-computed-en-head)"/>
<rect class="d-shadow" x="32" y="57.5" width="160" height="48" rx="10"/>
<rect class="d-tile" x="32" y="56" width="160" height="48" rx="10"/>
<text class="d-title" x="112" y="77" text-anchor="middle">query</text>
<text class="d-sub" x="112" y="93" text-anchor="middle">ref, text in the search field</text>
<rect class="d-shadow" x="32" y="117.5" width="160" height="48" rx="10"/>
<rect class="d-tile" x="32" y="116" width="160" height="48" rx="10"/>
<text class="d-title" x="112" y="137" text-anchor="middle">onlyAvailable</text>
<text class="d-sub" x="112" y="153" text-anchor="middle">ref, only available ones</text>
<rect class="d-shadow" x="32" y="177.5" width="160" height="48" rx="10"/>
<rect class="d-tile" x="32" y="176" width="160" height="48" rx="10"/>
<text class="d-title" x="112" y="197" text-anchor="middle">items</text>
<text class="d-sub" x="112" y="213" text-anchor="middle">the things of the catalog</text>
<rect class="d-shadow" x="240" y="57.5" width="144" height="168" rx="10"/>
<rect class="d-tile d-tile-accent" x="240" y="56" width="144" height="168" rx="10"/>
<text class="d-title" x="312" y="137" text-anchor="middle">visibleItems</text>
<text class="d-code" x="312" y="153" text-anchor="middle">computed</text>
<rect class="d-shadow" x="240" y="249.5" width="144" height="48" rx="10"/>
<rect class="d-tile" x="240" y="248" width="144" height="48" rx="10"/>
<text class="d-title" x="312" y="269" text-anchor="middle">availableCount</text>
<text class="d-code" x="312" y="285" text-anchor="middle">computed</text>
<rect class="d-shadow" x="432" y="57.5" width="216" height="168" rx="10"/>
<rect class="d-tile" x="432" y="56" width="216" height="168" rx="10"/>
<text class="d-title" x="540" y="137" text-anchor="middle">List</text>
<text class="d-code" x="540" y="153" text-anchor="middle">v-for="item in visibleItems"</text>
<rect class="d-shadow" x="432" y="249.5" width="216" height="48" rx="10"/>
<rect class="d-tile" x="432" y="248" width="216" height="48" rx="10"/>
<text class="d-title" x="540" y="269" text-anchor="middle">Number</text>
<text class="d-code" x="540" y="285" text-anchor="middle">{{ availableCount }} of …</text>
<rect class="d-strip" x="16" y="336" width="648" height="30" rx="8"/>
<text class="d-sub" x="340" y="355" text-anchor="middle">When query changes, Vue recalculates only visibleItems and renders the list again.</text>
</svg>
