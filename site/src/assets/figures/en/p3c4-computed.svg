<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-labelledby="p3c4-computed-en-title p3c4-computed-en-desc">
<title id="p3c4-computed-en-title">Dependencies of the computed values in the catalog</title>
<desc id="p3c4-computed-en-desc">On the left are the data items and the refs query and onlyAvailable. The computed value visibleItems reads all three, availableCount reads only items. The template shows the list from visibleItems and the number from availableCount. When query changes, Vue recalculates only visibleItems and updates the list.</desc>
<defs><marker id="p3c4-computed-en-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="fig-arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
<rect class="fig-box" x="20" y="20" width="190" height="60" rx="8"/>
<text class="fig-text" x="115" y="46" text-anchor="middle">items</text>
<text class="fig-sub" x="115" y="65" text-anchor="middle">the things of the catalog</text>
<rect class="fig-box fig-box-strong" x="20" y="100" width="190" height="60" rx="8"/>
<text class="fig-text" x="115" y="126" text-anchor="middle">query</text>
<text class="fig-sub" x="115" y="145" text-anchor="middle">ref, text in the search field</text>
<rect class="fig-box fig-box-strong" x="20" y="180" width="190" height="60" rx="8"/>
<text class="fig-text" x="115" y="206" text-anchor="middle">onlyAvailable</text>
<text class="fig-sub" x="115" y="225" text-anchor="middle">ref, only available ones</text>
<rect class="fig-box fig-box-strong" x="250" y="50" width="170" height="60" rx="8"/>
<text class="fig-text" x="335" y="76" text-anchor="middle">visibleItems</text>
<text class="fig-sub" x="335" y="95" text-anchor="middle">computed</text>
<rect class="fig-box fig-box-strong" x="250" y="160" width="170" height="60" rx="8"/>
<text class="fig-text" x="335" y="186" text-anchor="middle">availableCount</text>
<text class="fig-sub" x="335" y="205" text-anchor="middle">computed</text>
<rect class="fig-box" x="456" y="50" width="210" height="170" rx="8"/>
<text class="fig-text" x="561" y="80" text-anchor="middle">Template</text>
<text class="fig-code" x="468" y="112" xml:space="preserve">&lt;li v-for="item in</text>
<text class="fig-code" x="468" y="130" xml:space="preserve">  visibleItems"&gt;</text>
<text class="fig-code" x="468" y="190">{{ availableCount }} of …</text>
<path class="fig-arrow" d="M 212 50 L 246 72" marker-end="url(#p3c4-computed-en-head)"/>
<path class="fig-arrow" d="M 212 130 L 246 84" marker-end="url(#p3c4-computed-en-head)"/>
<path class="fig-arrow" d="M 212 210 L 246 96" marker-end="url(#p3c4-computed-en-head)"/>
<path class="fig-arrow" d="M 212 56 L 246 182" marker-end="url(#p3c4-computed-en-head)"/>
<path class="fig-arrow" d="M 422 80 L 452 112" marker-end="url(#p3c4-computed-en-head)"/>
<path class="fig-arrow" d="M 422 190 L 452 186" marker-end="url(#p3c4-computed-en-head)"/>
<text class="fig-sub fig-note" x="340" y="276" text-anchor="middle">When query changes, Vue recalculates only visibleItems and renders the list again.</text>
</svg>
