<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="p3c1-surveys-en-title p3c1-surveys-en-desc">
<title id="p3c1-surveys-en-title">Usage and satisfaction of React, Vue and Angular</title>
<desc id="p3c1-surveys-en-desc">Two bar charts on a scale from 0 to 100%. At the top the Stack Overflow survey of 2026 with the share of the answers on web frameworks that use the framework, React 41.5, Vue.js 17.2 and Angular 16.0%. At the bottom State of JS 2025 with the share of the users who would use the framework again, React 72, Vue.js 84 and Angular 48%.</desc>
<defs><marker id="p3c1-surveys-en-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p3c1-surveys-en-head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-accent" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="p3c1-surveys-en-head-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-head-violet" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs>
