name: site

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]

permissions:
  contents: read

# Every job writes to the gh-pages branch, so they run one after the other. With queue: max a new
# run waits behind the others instead of cancelling the one that already waits
concurrency:
  group: gh-pages
  cancel-in-progress: false
  queue: max

jobs:
  preview:
    name: Preview of the pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: github.event.action != 'closed'
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event.action != 'closed'
        with:
          node-version: "26"
          cache: pnpm
      - name: Install with the release age policy
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile
      - name: Build under the preview path
        if: github.event.action != 'closed'
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          SITE_BASE: /web2/pr-preview/pr-${{ github.event.pull_request.number }}/
        run: pnpm --filter ./site run build
      - name: Build the demo of the case app under the preview path
        if: github.event.action != 'closed'
        env:
          SITE_BASE: /web2/pr-preview/pr-${{ github.event.pull_request.number }}/
        run: node scripts/build_demo.mjs
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: site/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto

  deploy:
    name: Publish the site
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - name: Install with the release age policy
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: pnpm --filter ./site run build
      - name: Build the demo of the case app
        run: node scripts/build_demo.mjs
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: site/dist
          # Keep the previews of open pull requests
          clean-exclude: pr-preview/
          force: false
