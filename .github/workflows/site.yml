name: site

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]

permissions:
  contents: read

# Every job writes to the gh-pages branch, so they run one after the other. With queue: max a new
# run waits behind the others instead of cancelling the one that already waits
concurrency:
  group: gh-pages
  cancel-in-progress: false
  queue: max

jobs:
  preview:
    name: Preview of the pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit with its parents, so the footer finds the date of the head of the branch
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: github.event.action != 'closed'
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event.action != 'closed'
        with:
          node-version: "26"
          cache: pnpm
      - name: Install with the release age policy
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile
      - name: Build under the preview path
        if: github.event.action != 'closed'
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          SITE_BASE: /pr-preview/pr-${{ github.event.pull_request.number }}/
          # The footer names the head of the branch, not the merge commit GitHub builds
          SITE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: pnpm --filter ./site run build
      - name: Build the demo of the case app under the preview path
        if: github.event.action != 'closed'
        env:
          SITE_BASE: /pr-preview/pr-${{ github.event.pull_request.number }}/
        run: node scripts/build_demo.mjs
      - name: Every internal link and anchor of the site and the demo resolves
        if: github.event.action != 'closed'
        env:
          SITE_BASE: /pr-preview/pr-${{ github.event.pull_request.number }}/
        run: python3 scripts/check_links.py
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: site/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          # The site runs on its custom domain, not under the default address of GitHub Pages
          pages-base-url: web2.ndum.ch
          action: auto

  deploy:
    name: Publish the site
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - name: Install with the release age policy
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: pnpm --filter ./site run build
      - name: Build the demo of the case app
        run: node scripts/build_demo.mjs
      - name: Every internal link and anchor of the site and the demo resolves
        run: python3 scripts/check_links.py
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: site/dist
          # Keep the previews of open pull requests
          clean-exclude: pr-preview/
          force: false
