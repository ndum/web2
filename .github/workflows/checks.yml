name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  projects:
    name: Examples, exercises and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - name: Install with the release age policy
        run: pnpm install --frozen-lockfile
      - name: Every project uses the catalog of the case
        run: node scripts/sync_data.mjs --check
      - name: German and English variants match their sources
        run: node scripts/localize.mjs --check
      - name: Scripts behave as intended
        run: node --test "scripts/*.test.mjs"
      - name: The course API answers as documented
        working-directory: api
        run: npm test
      - name: Playground examples compile
        working-directory: site
        run: node --test "tests/*.test.mjs"
      - name: Solutions, the setup project, the case app and the optional examples pass their tests
        run: pnpm --filter "./exercises/*/*/solution/*" --filter "./exercises/00-start/setup/*" --filter "./case/*/*" --filter "./optional/*/*" run test
      - name: Examples of the JS workshop print what is recorded
        run: node scripts/run_examples.mjs
      - name: Exercise projects, the case app and the optional examples build
        run: pnpm --filter "./exercises/**" --filter "./case/*/*" --filter "./optional/*/*" run build
      - name: The end-to-end example runs in Chromium against the demo of the case app
        run: |
          pnpm --dir optional/end-to-end/de exec playwright install --with-deps --only-shell chromium
          pnpm --filter "./optional/end-to-end/*" run test:e2e
      - name: Figures are reproducible
        run: |
          node figures/start.mjs
          node figures/javascript.mjs
          node figures/spa.mjs
          node figures/vue.mjs
          node figures/components.mjs
          node figures/reactivity.mjs
          node figures/routing.mjs
          node figures/state.mjs
          node figures/architecture.mjs
          node figures/favicon.mjs
          git diff --exit-code

  text:
    name: House style and languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: House style
        run: python scripts/check_style.py
      - name: Both languages have the same structure
        run: python scripts/check_parity.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].{0,98}$'; then
            echo "The title becomes the squash commit message and must follow Conventional Commits."
            exit 1
          fi
